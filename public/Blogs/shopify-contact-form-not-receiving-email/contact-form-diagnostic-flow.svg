<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify contact form diagnostic flow</title>
  <desc id="desc">A decision flow routes a contact form problem to storefront code, Shopify acceptance, sender email, or the recipient mailbox.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="90" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">Follow the first missing signal</text>
  <text x="100" y="138" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">A controlled diagnostic for the native Shopify contact path.</text>

  <rect x="100" y="210" width="300" height="132" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="250" y="263" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">SUBMIT</text>
  <text x="250" y="302" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="22">Live storefront control</text>

  <path d="M400 276H500" stroke="#131313" stroke-width="6" stroke-linecap="round"/>
  <path d="M474 252L504 276L474 300" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="505" y="210" width="300" height="132" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="655" y="263" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">RESPONSE?</text>
  <text x="655" y="302" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Success, error, challenge</text>

  <path d="M805 276H905" stroke="#131313" stroke-width="6" stroke-linecap="round"/>
  <path d="M879 252L909 276L879 300" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="910" y="210" width="300" height="132" rx="24" fill="#131313"/>
  <text x="1060" y="263" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">DESTINATION</text>
  <text x="1060" y="302" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="22">Configured Sender email</text>

  <path d="M1210 276H1310" stroke="#131313" stroke-width="6" stroke-linecap="round"/>
  <path d="M1284 252L1314 276L1284 300" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1315" y="210" width="185" height="132" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="1408" y="263" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">INBOX</text>
  <text x="1408" y="302" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="22">Received?</text>

  <path d="M655 342V430M1060 342V430M1408 342V430" stroke="#707178" stroke-width="5"/>
  <path d="M631 404L655 434L679 404M1036 404L1060 434L1084 404M1384 404L1408 434L1432 404" fill="none" stroke="#707178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="490" y="435" width="330" height="180" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="655" y="484" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">NO CLEAR RESPONSE</text>
  <text x="655" y="526" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Theme • app • field</text>
  <text x="655" y="558" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">hCaptcha • JavaScript</text>
  <text x="655" y="594" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Compare native control</text>

  <rect x="895" y="435" width="330" height="180" rx="26" fill="#131313"/>
  <text x="1060" y="484" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">WRONG DESTINATION</text>
  <text x="1060" y="526" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="22">Sender email • forwarding</text>
  <text x="1060" y="558" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="22">closed mailbox • access</text>
  <text x="1060" y="594" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Correct and retest</text>

  <rect x="1243" y="435" width="257" height="180" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="1372" y="484" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">NOT IN INBOX</text>
  <text x="1372" y="526" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Spam • rules</text>
  <text x="1372" y="558" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">auth • provider</text>
  <text x="1372" y="594" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Compare mailbox</text>

  <path d="M250 342V680H800" fill="none" stroke="#131313" stroke-width="5"/>
  <path d="M775 656L805 680L775 704" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="805" y="650" width="695" height="132" rx="28" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="1152" y="702" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">SAVE THE PASSING CONTROL</text>
  <text x="1152" y="744" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">Page • theme • sender • destination • received result</text>

  <text x="100" y="850" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Illustrative diagnostic model. Change one handoff at a time.</text>
</svg>
