<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Variance-first stock count process</title>
  <desc id="desc">A staged flow moves from scope and preparation through count, review, approval, and follow-up.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="120" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">From shelf count to controlled update</text>
  <text x="100" y="170" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">The approval gate keeps uncertain lines out of the inventory update.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(100 270)">
      <rect width="210" height="170" rx="24" fill="#131313"/>
      <text x="34" y="68" fill="#facc15" font-size="25" font-weight="700">SCOPE</text>
      <text x="34" y="112" fill="#f6f5f1" font-size="22">One location</text>
      <text x="34" y="143" fill="#f6f5f1" font-size="22">Defined variants</text>
    </g>
    <path d="M325 355 H380" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
    <path d="M365 338 L386 355 L365 372" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(390 270)">
      <rect width="210" height="170" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
      <text x="28" y="68" fill="#131313" font-size="25" font-weight="700">PREPARE</text>
      <text x="28" y="112" fill="#707178" font-size="22">Clear movement</text>
      <text x="28" y="143" fill="#707178" font-size="22">Fix barcodes</text>
    </g>
    <path d="M615 355 H670" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
    <path d="M655 338 L676 355 L655 372" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(680 270)">
      <rect width="210" height="170" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
      <text x="45" y="68" fill="#131313" font-size="25" font-weight="700">COUNT</text>
      <text x="28" y="112" fill="#707178" font-size="22">Scan or enter</text>
      <text x="28" y="143" fill="#707178" font-size="22">Record observer</text>
    </g>
    <path d="M905 355 H960" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
    <path d="M945 338 L966 355 L945 372" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(970 270)">
      <rect width="210" height="170" rx="24" fill="#facc15" stroke="#131313" stroke-width="5"/>
      <text x="48" y="68" fill="#131313" font-size="25" font-weight="700">REVIEW</text>
      <text x="28" y="112" fill="#131313" font-size="22">Explain variance</text>
      <text x="28" y="143" fill="#131313" font-size="22">Recount risk</text>
    </g>
    <path d="M1195 355 H1250" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
    <path d="M1235 338 L1256 355 L1235 372" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1260 270)">
      <rect width="240" height="170" rx="24" fill="#131313"/>
      <text x="42" y="68" fill="#facc15" font-size="25" font-weight="700">APPROVE</text>
      <text x="34" y="112" fill="#f6f5f1" font-size="22">Update ready lines</text>
      <text x="34" y="143" fill="#f6f5f1" font-size="22">Reject uncertain</text>
    </g>

    <path d="M1380 455 V560 H815" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M832 543 L811 560 L832 577" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(560 560)">
      <rect width="500" height="190" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
      <text x="48" y="72" fill="#131313" font-size="28" font-weight="700">FOLLOW UP</text>
      <text x="48" y="116" fill="#707178" font-size="23">Trace the cause, assign the fix,</text>
      <text x="48" y="151" fill="#707178" font-size="23">and schedule the next risk-based count.</text>
      <circle cx="424" cy="95" r="44" fill="#facc15" stroke="#131313" stroke-width="5"/>
      <path d="M401 95 L418 112 L449 78" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
