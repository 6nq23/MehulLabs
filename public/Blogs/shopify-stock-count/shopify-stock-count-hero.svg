<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify stock count review workflow</title>
  <desc id="desc">Warehouse shelf cards move through a yellow review gate before approved inventory is updated.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="90" y="90" width="1420" height="720" rx="40" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="150" y="190" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">Shopify stock count</text>
  <text x="150" y="245" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="30">Count what is present. Review what changed.</text>

  <g transform="translate(150 330)">
    <rect width="350" height="300" rx="28" fill="#131313"/>
    <text x="42" y="62" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">SHELF COUNT</text>
    <rect x="42" y="96" width="266" height="18" rx="9" fill="#707178"/>
    <rect x="42" y="145" width="90" height="90" rx="12" fill="#facc15"/>
    <rect x="151" y="145" width="70" height="90" rx="12" fill="#f6f5f1"/>
    <rect x="240" y="145" width="68" height="90" rx="12" fill="#707178"/>
    <text x="42" y="270" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Physical evidence</text>
  </g>

  <path d="M535 480 H690" fill="none" stroke="#131313" stroke-width="12" stroke-linecap="round"/>
  <path d="M665 452 L700 480 L665 508" fill="none" stroke="#131313" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(700 330)">
    <rect width="280" height="300" rx="28" fill="#facc15" stroke="#131313" stroke-width="5"/>
    <circle cx="140" cy="112" r="56" fill="#f6f5f1" stroke="#131313" stroke-width="7"/>
    <path d="M112 112 L132 132 L172 88" fill="none" stroke="#131313" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="205" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">REVIEW</text>
    <text x="42" y="250" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">Explain or recount</text>
  </g>

  <path d="M1015 480 H1170" fill="none" stroke="#131313" stroke-width="12" stroke-linecap="round"/>
  <path d="M1145 452 L1180 480 L1145 508" fill="none" stroke="#131313" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1180 330)">
    <rect width="270" height="300" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
    <text x="38" y="62" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">APPROVED</text>
    <path d="M52 126 H218 M52 176 H218 M52 226 H178" stroke="#707178" stroke-width="18" stroke-linecap="round"/>
    <circle cx="218" cy="226" r="28" fill="#facc15" stroke="#131313" stroke-width="5"/>
    <path d="M205 226 L215 237 L233 216" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="150" y="720" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">OBSERVE</text>
  <text x="700" y="720" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">INVESTIGATE</text>
  <text x="1180" y="720" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">UPDATE</text>
</svg>
