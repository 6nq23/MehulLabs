<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision flow for missing Shopify product recommendations</title>
  <desc id="desc">A layered flow distinguishes recommendation choice, product eligibility, API response, and theme rendering failures.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="90" y="96" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Find the first failed layer</text>
  <text x="90" y="142" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Keep one source product, one candidate, and one shopper context fixed.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="205" width="1420" height="118" rx="24" fill="#facc15" stroke="#131313" stroke-width="3"/>
    <text x="128" y="256" fill="#131313" font-size="25" font-weight="800">INTENT</text>
    <text x="128" y="291" fill="#131313" font-size="22">Does the block request the same related or complementary type that you saved?</text>
    <rect x="1285" y="236" width="174" height="56" rx="28" fill="#131313"/>
    <text x="1372" y="272" text-anchor="middle" fill="#f6f5f1" font-size="22" font-weight="700">MATCH</text>
    <path d="M800 323 V363" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M786 349 L800 367 L814 349" fill="none" stroke="#131313" stroke-width="5"/>
    <rect x="90" y="375" width="1420" height="118" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="3"/>
    <text x="128" y="426" fill="#131313" font-size="25" font-weight="800">ELIGIBILITY</text>
    <text x="128" y="461" fill="#707178" font-size="22">Is the candidate active, published, priced, available, and absent from the cart?</text>
    <rect x="1285" y="406" width="174" height="56" rx="28" fill="#131313"/>
    <text x="1372" y="442" text-anchor="middle" fill="#f6f5f1" font-size="22" font-weight="700">PASS</text>
    <path d="M800 493 V533" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M786 519 L800 537 L814 519" fill="none" stroke="#131313" stroke-width="5"/>
    <rect x="90" y="545" width="1420" height="118" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="3"/>
    <text x="128" y="596" fill="#131313" font-size="25" font-weight="800">RESPONSE</text>
    <text x="128" y="631" fill="#707178" font-size="22">Does the recommendation request return products for the exact source and intent?</text>
    <rect x="1285" y="576" width="174" height="56" rx="28" fill="#131313"/>
    <text x="1372" y="612" text-anchor="middle" fill="#f6f5f1" font-size="22" font-weight="700">RETURNED</text>
    <path d="M800 663 V703" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M786 689 L800 707 L814 689" fill="none" stroke="#131313" stroke-width="5"/>
    <rect x="90" y="715" width="1420" height="118" rx="24" fill="#131313" stroke="#131313" stroke-width="3"/>
    <text x="128" y="766" fill="#facc15" font-size="25" font-weight="800">RENDER</text>
    <text x="128" y="801" fill="#f6f5f1" font-size="22">If products were returned, repair the template, product card, JavaScript, CSS, or app conflict.</text>
    <rect x="1285" y="746" width="174" height="56" rx="28" fill="#facc15"/>
    <text x="1372" y="782" text-anchor="middle" fill="#131313" font-size="22" font-weight="700">VISIBLE</text>
  </g>
</svg>
