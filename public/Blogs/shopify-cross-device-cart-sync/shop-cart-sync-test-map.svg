<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Six-step Shopify cart sync test map</title>
  <desc id="desc">A six-step process checks Shop identity, device switching, cart conflicts, product availability, regional settings, and checkout completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5faf7"/><stop offset="1" stop-color="#e8f4ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#143630" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="100" y="102" fill="#1c5149" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="4">CROSS-DEVICE CART QA</text>
  <text x="100" y="172" fill="#102f2b" font-family="Manrope,Inter,Arial,sans-serif" font-size="54" font-weight="800">Test continuity before conversion.</text>
  <text x="100" y="218" fill="#58736d" font-family="Inter,Arial,sans-serif" font-size="23">Each gate answers one failure question in the live buying journey.</text>
  <path d="M220 480 H1380" fill="none" stroke="#9cc8ba" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(92 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#173f3b"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">1</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">IDENTITY</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">Recognized Shop user</tspan><tspan x="110" dy="26">versus anonymous</tspan></text><rect x="42" y="274" width="136" height="34" rx="17" fill="#e0f3ec"/><text x="110" y="297" text-anchor="middle" fill="#276154" font-size="14" font-weight="800">WHO QUALIFIES?</text></g>
    <g transform="translate(332 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#26715f"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">2</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">DEVICES</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">Phone to desktop</tspan><tspan x="110" dy="26">and back again</tspan></text><rect x="38" y="274" width="144" height="34" rx="17" fill="#e0f3ec"/><text x="110" y="297" text-anchor="middle" fill="#276154" font-size="14" font-weight="800">DOES IT FOLLOW?</text></g>
    <g transform="translate(572 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#d99b25"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">3</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">CONFLICT</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">A different cart</tspan><tspan x="110" dy="26">already exists</tspan></text><rect x="35" y="274" width="150" height="34" rx="17" fill="#fff1ce"/><text x="110" y="297" text-anchor="middle" fill="#875b08" font-size="14" font-weight="800">NO CART MERGE</text></g>
    <g transform="translate(812 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#26715f"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">4</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">PRODUCT</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">Variant and channel</tspan><tspan x="110" dy="26">availability agree</tspan></text><rect x="39" y="274" width="142" height="34" rx="17" fill="#e0f3ec"/><text x="110" y="297" text-anchor="middle" fill="#276154" font-size="14" font-weight="800">CAN IT BE BOUGHT?</text></g>
    <g transform="translate(1052 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#d99b25"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">5</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">REGION</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">Market, currency and</tspan><tspan x="110" dy="26">shipping country</tspan></text><rect x="42" y="274" width="136" height="34" rx="17" fill="#fff1ce"/><text x="110" y="297" text-anchor="middle" fill="#875b08" font-size="14" font-weight="800">DOES IT TRAVEL?</text></g>
    <g transform="translate(1292 312)"><rect width="220" height="340" rx="28" fill="#ffffff"/><circle cx="110" cy="76" r="43" fill="#173f3b"/><text x="110" y="88" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">6</text><text x="110" y="154" text-anchor="middle" fill="#163b36" font-size="23" font-weight="800">CHECKOUT</text><text x="110" y="198" text-anchor="middle" fill="#5c746f" font-size="17"><tspan x="110">Payment, discount</tspan><tspan x="110" dy="26">and order complete</tspan></text><rect x="38" y="274" width="144" height="34" rx="17" fill="#e0f3ec"/><text x="110" y="297" text-anchor="middle" fill="#276154" font-size="14" font-weight="800">DID IT CONVERT?</text></g>
  </g>
  <g transform="translate(100 724)" font-family="Inter,Arial,sans-serif">
    <rect width="1400" height="96" rx="24" fill="#153e39"/>
    <text x="44" y="41" fill="#8ce2c8" font-size="17" font-weight="800" letter-spacing="2">RELEASE RULE</text>
    <text x="44" y="72" fill="#ffffff" font-size="23" font-weight="700">Record screenshots and one test order ID before reading a conversion lift into the data.</text>
  </g>
</svg>
