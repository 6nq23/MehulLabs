<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify cross-device cart sync</title>
  <desc id="desc">A mobile store cart passes through a Shop identity layer to a desktop checkout while the same two items remain in the cart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a24"/>
      <stop offset="0.55" stop-color="#123b43"/>
      <stop offset="1" stop-color="#1d655c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffd166" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7ee0c3" stop-opacity=".18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020b10" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1380" cy="120" r="240" fill="#69d1b4" opacity=".08"/>
  <circle cx="150" cy="780" r="290" fill="#ffd166" opacity=".06"/>
  <text x="112" y="118" fill="#8ce2c8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">SHOPIFY CONVERSION · 2026</text>
  <text x="112" y="190" fill="#ffffff" font-family="Manrope,Inter,Arial,sans-serif" font-size="58" font-weight="800">One cart. Two devices.</text>
  <text x="112" y="238" fill="#c9ddd9" font-family="Inter,Arial,sans-serif" font-size="25">Test the identity, market and checkout states—not the headline.</text>

  <g filter="url(#shadow)">
    <rect x="150" y="320" width="300" height="460" rx="48" fill="#f8faf8"/>
    <rect x="176" y="366" width="248" height="326" rx="24" fill="#edf5f1"/>
    <rect x="262" y="338" width="75" height="8" rx="4" fill="#96aba5"/>
    <text x="202" y="415" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">MOBILE CART</text>
    <g transform="translate(202 458)">
      <rect width="196" height="84" rx="16" fill="#ffffff"/>
      <rect x="14" y="14" width="56" height="56" rx="12" fill="#ffd166"/>
      <text x="86" y="35" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Product A</text>
      <text x="86" y="61" fill="#61736f" font-family="Inter,Arial,sans-serif" font-size="14">Qty 1 · M</text>
    </g>
    <g transform="translate(202 558)">
      <rect width="196" height="84" rx="16" fill="#ffffff"/>
      <rect x="14" y="14" width="56" height="56" rx="12" fill="#7ee0c3"/>
      <text x="86" y="35" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Product B</text>
      <text x="86" y="61" fill="#61736f" font-family="Inter,Arial,sans-serif" font-size="14">Qty 1 · Blue</text>
    </g>
    <rect x="202" y="666" width="196" height="50" rx="16" fill="#163f3b"/>
    <text x="300" y="698" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">CONTINUE</text>
  </g>

  <path d="M476 548 H1120" fill="none" stroke="url(#beam)" stroke-width="12" stroke-linecap="round"/>
  <path d="M1087 522 L1124 548 L1087 574" fill="none" stroke="#8ce2c8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <circle cx="790" cy="548" r="112" fill="#0f292e" stroke="#8ce2c8" stroke-width="3"/>
    <circle cx="790" cy="548" r="86" fill="#173d3c"/>
    <path d="M748 533 h84 l-10 58 h-64 z" fill="none" stroke="#ffd166" stroke-width="8" stroke-linejoin="round"/>
    <path d="M760 533 c0-35 60-35 60 0" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round"/>
    <text x="790" y="690" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">SHOP IDENTITY</text>
    <text x="790" y="720" text-anchor="middle" fill="#bcd4ce" font-family="Inter,Arial,sans-serif" font-size="15">Recognized or signed in</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="350" width="330" height="330" rx="28" fill="#f8faf8"/>
    <rect x="1168" y="382" width="274" height="214" rx="18" fill="#edf5f1"/>
    <rect x="1110" y="680" width="390" height="30" rx="15" fill="#dbe7e2"/>
    <text x="1194" y="430" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">DESKTOP CHECKOUT</text>
    <rect x="1194" y="462" width="222" height="48" rx="12" fill="#ffffff"/>
    <circle cx="1224" cy="486" r="14" fill="#ffd166"/>
    <text x="1250" y="493" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="16">Product A · Qty 1</text>
    <rect x="1194" y="522" width="222" height="48" rx="12" fill="#ffffff"/>
    <circle cx="1224" cy="546" r="14" fill="#7ee0c3"/>
    <text x="1250" y="553" fill="#17322f" font-family="Inter,Arial,sans-serif" font-size="16">Product B · Qty 1</text>
    <rect x="1194" y="612" width="222" height="42" rx="13" fill="#163f3b"/>
    <text x="1305" y="639" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">SHOP PAY</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">
    <rect x="510" y="784" width="178" height="44" rx="22" fill="#ffffff" opacity=".10"/><text x="599" y="812" text-anchor="middle" fill="#d8ebe6">CART PERSISTS</text>
    <rect x="710" y="784" width="178" height="44" rx="22" fill="#ffffff" opacity=".10"/><text x="799" y="812" text-anchor="middle" fill="#d8ebe6">DEVICE SWITCH</text>
    <rect x="910" y="784" width="178" height="44" rx="22" fill="#ffffff" opacity=".10"/><text x="999" y="812" text-anchor="middle" fill="#d8ebe6">CHECKOUT QA</text>
  </g>
</svg>
