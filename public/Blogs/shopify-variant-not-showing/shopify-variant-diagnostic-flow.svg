<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision flow for a missing Shopify variant</title>
  <desc id="desc">A diagnostic flow checks the admin record, market availability, product template, and selection state before choosing a repair.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="112" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">Find the first failed gate</text>
  <text x="110" y="160" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">Use the same product, option value, market, and browser throughout.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="238" width="300" height="144" rx="22" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="148" y="292" fill="#131313" font-size="25" font-weight="700">ADMIN RECORD</text>
    <text x="148" y="337" fill="#131313" font-size="24">Variant saved?</text>

    <path d="M410 310h92" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M488 293l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="279" fill="#707178" font-size="22">YES</text>

    <rect x="510" y="238" width="300" height="144" rx="22" fill="none" stroke="#131313" stroke-width="4"/>
    <text x="548" y="292" fill="#131313" font-size="25" font-weight="700">MARKET STATE</text>
    <text x="548" y="337" fill="#131313" font-size="24">Published + available?</text>

    <path d="M810 310h92" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M888 293l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="840" y="279" fill="#707178" font-size="22">YES</text>

    <rect x="910" y="238" width="300" height="144" rx="22" fill="none" stroke="#131313" stroke-width="4"/>
    <text x="948" y="282" fill="#131313" font-size="25" font-weight="700">PRODUCT</text>
    <text x="948" y="316" fill="#131313" font-size="25" font-weight="700">TEMPLATE</text>
    <text x="948" y="352" fill="#131313" font-size="24">Picker rendered?</text>

    <path d="M1210 310h92" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M1288 293l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1240" y="279" fill="#707178" font-size="22">YES</text>

    <rect x="1310" y="238" width="180" height="144" rx="22" fill="#131313"/>
    <text x="1342" y="292" fill="#f6f5f1" font-size="25" font-weight="700">STATE</text>
    <text x="1342" y="337" fill="#f6f5f1" font-size="23">Updates?</text>

    <path d="M260 382v122" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M243 490l17 22 17-22" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="278" y="455" fill="#707178" font-size="22">NO</text>

    <path d="M660 382v122" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M643 490l17 22 17-22" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="678" y="455" fill="#707178" font-size="22">NO</text>

    <path d="M1060 382v122" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M1043 490l17 22 17-22" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1078" y="455" fill="#707178" font-size="22">NO</text>

    <path d="M1400 382v122" fill="none" stroke="#131313" stroke-width="5"/>
    <path d="M1383 490l17 22 17-22" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1418" y="455" fill="#707178" font-size="22">NO</text>

    <rect x="110" y="512" width="300" height="154" rx="22" fill="none" stroke="#131313" stroke-width="4"/>
    <text x="148" y="568" fill="#131313" font-size="25" font-weight="700">REPAIR DATA</text>
    <text x="148" y="611" fill="#707178" font-size="22">Create or save the</text>
    <text x="148" y="642" fill="#707178" font-size="22">missing combination</text>

    <rect x="510" y="512" width="300" height="154" rx="22" fill="none" stroke="#131313" stroke-width="4"/>
    <text x="548" y="568" fill="#131313" font-size="25" font-weight="700">REPAIR ACCESS</text>
    <text x="548" y="611" fill="#707178" font-size="22">Publish variant and</text>
    <text x="548" y="642" fill="#707178" font-size="22">correct inventory</text>

    <rect x="910" y="512" width="300" height="154" rx="22" fill="none" stroke="#131313" stroke-width="4"/>
    <text x="948" y="568" fill="#131313" font-size="25" font-weight="700">REPAIR TEMPLATE</text>
    <text x="948" y="611" fill="#707178" font-size="22">Restore the option</text>
    <text x="948" y="642" fill="#707178" font-size="22">control or assignment</text>

    <rect x="1310" y="512" width="180" height="154" rx="22" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="1338" y="568" fill="#131313" font-size="25" font-weight="700">REPAIR</text>
    <text x="1338" y="602" fill="#131313" font-size="25" font-weight="700">CODE</text>
    <text x="1338" y="642" fill="#131313" font-size="22">Theme/app</text>

    <rect x="110" y="744" width="1380" height="72" rx="18" fill="#131313"/>
    <text x="150" y="791" fill="#f6f5f1" font-size="27" font-weight="700">After every repair: verify picker → price → image → cart → checkout</text>
    <circle cx="1435" cy="780" r="20" fill="#facc15"/>
  </g>
</svg>

