<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify variant diagnostic layers</title>
  <desc id="desc">A product option moves through product data, publication, theme rendering, and storefront selection checks.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="92" y="86" width="1416" height="728" rx="36" fill="none" stroke="#131313" stroke-width="6"/>
  <text x="140" y="172" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">Where did the variant disappear?</text>
  <text x="140" y="222" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Trace one option value through every storefront layer.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="140" y="312" width="274" height="270" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="174" y="378" fill="#131313" font-size="25" font-weight="700">PRODUCT DATA</text>
    <text x="174" y="442" fill="#131313" font-size="34" font-weight="700">Size: Medium</text>
    <text x="174" y="493" fill="#131313" font-size="24">Variant exists</text>
    <text x="174" y="531" fill="#131313" font-size="24">and is saved</text>

    <path d="M438 447h68" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M494 430l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="530" y="312" width="274" height="270" rx="24" fill="none" stroke="#131313" stroke-width="4"/>
    <circle cx="667" cy="393" r="40" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <path d="M647 394l14 14 28-34" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="566" y="484" fill="#131313" font-size="25" font-weight="700">PUBLISHED</text>
    <text x="566" y="526" fill="#707178" font-size="23">Channel + catalog</text>

    <path d="M828 447h68" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M884 430l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="920" y="312" width="274" height="270" rx="24" fill="none" stroke="#131313" stroke-width="4"/>
    <rect x="968" y="365" width="178" height="62" rx="12" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="1004" y="405" fill="#131313" font-size="25" font-weight="700">Medium</text>
    <text x="958" y="484" fill="#131313" font-size="25" font-weight="700">THEME PICKER</text>
    <text x="969" y="526" fill="#707178" font-size="23">Rendered + active</text>

    <path d="M1218 447h68" fill="none" stroke="#131313" stroke-width="6"/>
    <path d="M1274 430l22 17-22 17" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1310" y="312" width="150" height="270" rx="24" fill="#131313"/>
    <path d="M1355 398l26 26 47-61" fill="none" stroke="#facc15" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1344" y="485" fill="#f6f5f1" font-size="25" font-weight="700">CART</text>
    <text x="1332" y="524" fill="#f6f5f1" font-size="22">Right item</text>
  </g>

  <rect x="140" y="650" width="1320" height="96" rx="20" fill="#131313"/>
  <text x="180" y="711" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">First failed layer = first repair target</text>
  <circle cx="1382" cy="698" r="22" fill="#facc15"/>
</svg>

