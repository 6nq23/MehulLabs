<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify size chart decision flow</title>
  <desc id="desc">Four connected gates move from measurement ownership to regional sizing, product assignment, and storefront testing.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="102" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">SIZE CHART CONTROL FLOW</text>
  <text x="100" y="180" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Four gates before a shopper sees the chart</text>
  <text x="100" y="232" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Each gate has one question and one release condition.</text>

  <path d="M245 460H485M615 460H855M985 460H1225" stroke="#131313" stroke-width="6"/>
  <path d="M467 442l24 18-24 18M837 442l24 18-24 18M1207 442l24 18-24 18" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="320" width="310" height="300" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <circle cx="132" cy="374" r="28" fill="#facc15"/>
    <text x="123" y="383" fill="#131313" font-size="26" font-weight="800">1</text>
    <text x="178" y="384" fill="#131313" font-size="28" font-weight="800">MEASURE</text>
    <text x="112" y="454" fill="#131313" font-size="25" font-weight="700">What is the source?</text>
    <text x="112" y="500" fill="#707178" font-size="23">Body or garment</text>
    <text x="112" y="536" fill="#707178" font-size="23">Named unit</text>
    <text x="112" y="572" fill="#707178" font-size="23">Approved owner</text>

    <rect x="450" y="320" width="310" height="300" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <circle cx="502" cy="374" r="28" fill="#facc15"/>
    <text x="493" y="383" fill="#131313" font-size="26" font-weight="800">2</text>
    <text x="548" y="384" fill="#131313" font-size="28" font-weight="800">TRANSLATE</text>
    <text x="482" y="446" fill="#131313" font-size="23" font-weight="700">Which sizing system</text>
    <text x="482" y="476" fill="#131313" font-size="23" font-weight="700">applies?</text>
    <text x="482" y="520" fill="#707178" font-size="23">US / UK / EU</text>
    <text x="482" y="556" fill="#707178" font-size="23">cm and inches</text>
    <text x="482" y="592" fill="#707178" font-size="23">Consistent feed labels</text>

    <rect x="820" y="320" width="310" height="300" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <circle cx="872" cy="374" r="28" fill="#facc15"/>
    <text x="863" y="383" fill="#131313" font-size="26" font-weight="800">3</text>
    <text x="918" y="384" fill="#131313" font-size="28" font-weight="800">ASSIGN</text>
    <text x="852" y="446" fill="#131313" font-size="23" font-weight="700">Where should the chart</text>
    <text x="852" y="476" fill="#131313" font-size="23" font-weight="700">show?</text>
    <text x="852" y="520" fill="#707178" font-size="23">Product family</text>
    <text x="852" y="556" fill="#707178" font-size="23">Metafield reference</text>
    <text x="852" y="592" fill="#707178" font-size="23">Empty-state rule</text>

    <rect x="1190" y="320" width="310" height="300" rx="28" fill="#131313"/>
    <circle cx="1242" cy="374" r="28" fill="#facc15"/>
    <text x="1233" y="383" fill="#131313" font-size="26" font-weight="800">4</text>
    <text x="1288" y="384" fill="#f6f5f1" font-size="28" font-weight="800">VERIFY</text>
    <text x="1222" y="454" fill="#f6f5f1" font-size="25" font-weight="700">Can shoppers use it?</text>
    <text x="1222" y="500" fill="#f6f5f1" font-size="23">Phone and keyboard</text>
    <text x="1222" y="536" fill="#f6f5f1" font-size="23">Variant matches chart</text>
    <text x="1222" y="572" fill="#f6f5f1" font-size="23">Measurement QA</text>
  </g>

  <g fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M410 442l24 18-24 18"/>
    <path d="M780 442l24 18-24 18"/>
    <path d="M1150 442l24 18-24 18"/>
  </g>

  <rect x="100" y="704" width="1400" height="100" rx="24" fill="#facc15"/>
  <text x="800" y="750" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">RELEASE RULE</text>
  <text x="800" y="786" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25">Publish only when the measurement source, label system, product assignment, and storefront behavior agree.</text>
</svg>
