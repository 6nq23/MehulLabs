<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Draft order invoice failure decision flow</title>
  <desc id="desc">A decision flow separates missing invoice email from broken checkout link and payment failures.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="110" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">INVOICE HANDOFF MAP</text>
  <text x="100" y="180" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">Stop at the first failed boundary</text>
  <rect x="100" y="250" width="300" height="150" rx="24" fill="#131313"/>
  <text x="142" y="310" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">DRAFT READY</text>
  <text x="142" y="352" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="23">Contact + order checked</text>
  <path d="M400 325H506" stroke="#131313" stroke-width="8"/>
  <path d="M480 297L512 325L480 353" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="540" y="250" width="300" height="150" rx="24" fill="#facc15" stroke="#131313" stroke-width="5"/>
  <text x="582" y="310" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">MESSAGE SENT</text>
  <text x="582" y="352" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Invoice or direct link</text>
  <path d="M840 325H946" stroke="#131313" stroke-width="8"/>
  <path d="M920 297L952 325L920 353" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="980" y="250" width="300" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="1022" y="310" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">CHECKOUT OPENS</text>
  <text x="1022" y="352" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Rules + payment route</text>
  <path d="M1280 325H1350" stroke="#131313" stroke-width="8"/>
  <path d="M1324 297L1356 325L1324 353" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1434" cy="325" r="68" fill="#131313"/>
  <path d="M1402 326L1424 348L1466 302" fill="none" stroke="#facc15" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M690 400V500" stroke="#131313" stroke-width="7" stroke-dasharray="12 12"/>
  <path d="M662 474L690 506L718 474" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="510" y="530" width="360" height="184" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="552" y="588" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">NO EMAIL?</text>
  <text x="552" y="632" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Verify address + mailbox</text>
  <text x="552" y="672" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Check sender authentication</text>
  <path d="M1130 400V500" stroke="#131313" stroke-width="7" stroke-dasharray="12 12"/>
  <path d="M1102 474L1130 506L1158 474" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="950" y="530" width="360" height="184" rx="26" fill="#131313"/>
  <text x="992" y="588" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">LINK BLOCKED?</text>
  <text x="992" y="632" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Record the exact error</text>
  <text x="992" y="672" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="24">Assign the first failed rule</text>
  <text x="100" y="812" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">One saved draft. One active link. One named owner.</text>
</svg>
