<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Choose the right Shopify sold-out recovery path</title>
  <desc id="desc">A sold-out product card branches to back-in-stock alert, preorder, or a substitute product based on supply certainty.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <g font-family="Inter, Arial, sans-serif" fill="#131313">
    <text x="110" y="116" font-size="34" font-weight="700" letter-spacing="3">SHOPIFY CONVERSION DECISION</text>
    <text x="110" y="190" font-size="64" font-weight="800">A sold-out button is not a strategy.</text>
    <text x="110" y="242" font-size="28" fill="#707178">Choose the promise your inventory can support.</text>

    <rect x="110" y="330" width="360" height="350" rx="28" fill="#131313"/>
    <rect x="145" y="365" width="290" height="170" rx="18" fill="#707178" opacity="0.38"/>
    <path d="M205 485l58-54 43 38 55-66 42 82z" fill="#facc15" opacity="0.9"/>
    <text x="155" y="585" font-size="30" font-weight="700" fill="#f6f5f1">Variant sold out</text>
    <text x="155" y="625" font-size="23" fill="#f6f5f1">What can the store promise?</text>

    <path d="M470 505H575" stroke="#131313" stroke-width="8"/>
    <path d="M551 481l28 24-28 24" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M600 391V567M600 391H625M600 567H625M600 479H985" fill="none" stroke="#131313" stroke-width="6"/>

    <rect x="625" y="316" width="310" height="150" rx="24" fill="#facc15"/>
    <text x="665" y="373" font-size="30" font-weight="800">ALERT</text>
    <text x="665" y="414" font-size="23">Timing is uncertain</text>

    <rect x="625" y="492" width="310" height="150" rx="24" fill="#131313"/>
    <text x="665" y="550" font-size="30" font-weight="800" fill="#f6f5f1">PREORDER</text>
    <text x="665" y="591" font-size="23" fill="#f6f5f1">Promise is dependable</text>

    <rect x="985" y="404" width="500" height="150" rx="24" fill="#f6f5f1" stroke="#707178" stroke-width="4"/>
    <text x="1030" y="463" font-size="30" font-weight="800">SUBSTITUTE</text>
    <text x="1030" y="504" font-size="23" fill="#707178">The original product will not return</text>

    <text x="110" y="805" font-size="27" font-weight="700">CERTAINTY → CUSTOMER PROMISE → MESSAGE</text>
    <rect x="110" y="830" width="900" height="12" rx="6" fill="#facc15"/>
  </g>
</svg>
