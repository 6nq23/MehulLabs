<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Simple cash runway: six months at a constant burn</title><desc id="d">Closing cash falls from 600,000 at the start by 100,000 a month and reaches zero after month six. Month-one costs of 400,000 (fixed 220,000, variable 90,000, marketing 90,000) against revenue of 300,000 create the 100,000 burn.</desc>
<rect width="1600" height="900" fill="#f6f5f1"/>
<g font-family="Inter, Arial, sans-serif" fill="#131313">
<text x="80" y="100" font-size="24" font-weight="700" letter-spacing="3" fill="#707178">WORKED RUNWAY EXAMPLE</text><text x="80" y="160" font-size="48" font-weight="700">₹600,000 cash ÷ ₹100,000 monthly burn = 6 months</text><text x="80" y="210" font-size="24" fill="#707178">Month one: revenue ₹300,000 − costs ₹400,000 (fixed ₹220,000 + variable ₹90,000 + marketing ₹90,000) = burn ₹100,000</text><line x1="100" y1="760" x2="1500" y2="760" stroke="#131313" stroke-width="2"/><rect x="120" y="300" width="150" height="460" rx="6" fill="#facc15"/><text x="195.0" y="284" font-size="24" font-weight="700" text-anchor="middle">₹600,000</text><text x="195.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Start</text><rect x="320" y="377" width="150" height="383" rx="6" fill="#facc15"/><text x="395.0" y="361" font-size="24" font-weight="700" text-anchor="middle">₹500,000</text><text x="395.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 1</text><rect x="520" y="453" width="150" height="307" rx="6" fill="#facc15"/><text x="595.0" y="437" font-size="24" font-weight="700" text-anchor="middle">₹400,000</text><text x="595.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 2</text><rect x="720" y="530" width="150" height="230" rx="6" fill="#facc15"/><text x="795.0" y="514" font-size="24" font-weight="700" text-anchor="middle">₹300,000</text><text x="795.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 3</text><rect x="920" y="607" width="150" height="153" rx="6" fill="#facc15"/><text x="995.0" y="591" font-size="24" font-weight="700" text-anchor="middle">₹200,000</text><text x="995.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 4</text><rect x="1120" y="683" width="150" height="77" rx="6" fill="#facc15"/><text x="1195.0" y="667" font-size="24" font-weight="700" text-anchor="middle">₹100,000</text><text x="1195.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 5</text><rect x="1320" y="760" width="150" height="4" rx="6" fill="#c2410c"/><text x="1395.0" y="744" font-size="24" font-weight="700" text-anchor="middle">₹0</text><text x="1395.0" y="800" font-size="24" text-anchor="middle" fill="#707178">Month 6</text><text x="80" y="850" font-size="22" fill="#707178">Zero revenue growth assumed. Illustrative inputs from this guide, not a forecast.</text><text x="1520" y="850" font-size="22" font-weight="700" text-anchor="end">MlabsGrowth</text>
</g>
</svg>
