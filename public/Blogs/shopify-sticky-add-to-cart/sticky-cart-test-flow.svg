<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sticky cart release test flow</title>
  <desc id="desc">A four-stage flow from product state through sticky control and cart response to a profit-based release decision.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="120" y="115" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Test the whole purchase path</text>
  <text x="120" y="165" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26">A visible button is only the middle of the system.</text>
  <path d="M396 426 H510 M762 426 H876 M1128 426 H1242" stroke="#131313" stroke-width="10" stroke-linecap="round"/>
  <path d="M478 398 L516 426 L478 454 M844 398 L882 426 L844 454 M1210 398 L1248 426 L1210 454" fill="none" stroke="#131313" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="270" width="306" height="320" rx="30" fill="#facc15" stroke="#131313" stroke-width="6"/>
  <text x="132" y="340" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">PRODUCT STATE</text>
  <text x="132" y="402" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Variant</text>
  <text x="132" y="447" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Price and quantity</text>
  <text x="132" y="492" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Availability</text>
  <text x="132" y="537" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Custom options</text>
  <rect x="456" y="270" width="306" height="320" rx="30" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="498" y="340" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">STICKY CONTROL</text>
  <text x="498" y="402" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Appears on cue</text>
  <text x="498" y="447" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Mirrors selection</text>
  <text x="498" y="492" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Submits once</text>
  <text x="498" y="537" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Never obscures</text>
  <rect x="822" y="270" width="306" height="320" rx="30" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="864" y="340" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">CART RESPONSE</text>
  <text x="864" y="402" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Correct line item</text>
  <text x="864" y="447" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Drawer refreshes</text>
  <text x="864" y="492" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Error is visible</text>
  <text x="864" y="537" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Analytics fires once</text>
  <rect x="1188" y="270" width="322" height="320" rx="30" fill="#131313"/>
  <text x="1230" y="340" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">RELEASE DECISION</text>
  <text x="1230" y="402" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Delivered orders</text>
  <text x="1230" y="447" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Contribution</text>
  <text x="1230" y="492" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Returns and support</text>
  <text x="1230" y="537" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Keep or roll back</text>
  <rect x="120" y="690" width="1360" height="92" rx="22" fill="#facc15"/>
  <text x="800" y="748" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Accuracy first. Profit decides.</text>
</svg>
