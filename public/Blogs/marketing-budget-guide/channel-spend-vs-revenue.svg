<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Channel spend and projected revenue in a 50,000 marketing budget</title><desc id="d">Paid search 20,000 spend at 3.5x projects 70,000; paid social 17,500 at 2.5x projects 43,750; creators 7,500 at 2x projects 15,000; retargeting 5,000 at 4.25x projects 21,250. Total 50,000 spend at 3.0x blended projects 150,000 revenue and 150 orders at a 1,000 average order value.</desc>
