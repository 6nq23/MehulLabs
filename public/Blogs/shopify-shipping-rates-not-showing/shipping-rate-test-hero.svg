<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify shipping rate checkout acceptance test</title>
  <desc id="desc">A checkout card connects cart and address inputs to product, market, rate, and carrier checks.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="96" y="88" width="1408" height="724" rx="38" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="150" y="170" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">CHECKOUT ACCEPTANCE TEST</text>
  <text x="150" y="248" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">Why is the shipping rate missing?</text>
  <rect x="150" y="312" width="380" height="150" rx="24" fill="#131313"/>
  <text x="190" y="370" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">CART</text>
  <text x="190" y="414" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="26">Product · weight · offer</text>
  <rect x="150" y="492" width="380" height="150" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="190" y="550" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">ADDRESS</text>
  <text x="190" y="594" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26">Country · region · postcode</text>
  <path d="M570 477H690" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <path d="M664 449L696 477L664 505" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="312" width="320" height="330" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="760" y="370" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">MATCH LAYERS</text>
  <text x="760" y="425" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="29">Product + location</text>
  <line x1="760" y1="448" x2="992" y2="448" stroke="#707178" stroke-width="3"/>
  <text x="760" y="495" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="29">Market + zone</text>
  <line x1="760" y1="518" x2="992" y2="518" stroke="#707178" stroke-width="3"/>
  <text x="760" y="565" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="29">Rate + provider</text>
  <circle cx="1000" cy="592" r="17" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <path d="M1080 477H1188" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <path d="M1162 449L1194 477L1162 505" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1220" y="352" width="220" height="250" rx="30" fill="#131313"/>
  <circle cx="1330" cy="430" r="39" fill="#facc15"/>
  <path d="M1310 430L1326 446L1356 412" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1264" y="520" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">RATE</text>
  <text x="1252" y="558" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25">or exact fault</text>
  <text x="150" y="728" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">Freeze the cart. Freeze the address. Change one rule at a time.</text>
</svg>

