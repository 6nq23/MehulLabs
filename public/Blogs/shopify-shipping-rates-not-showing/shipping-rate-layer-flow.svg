<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shipping rate fault isolation flow</title>
  <desc id="desc">A flow from product and origin through market, rate conditions, and carrier or app response.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="112" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3">RATE-ELIGIBILITY FLOW</text>
  <text x="100" y="180" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">Find the first layer that fails</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="100" y="260" width="270" height="180" rx="26" fill="#131313"/>
    <text x="135" y="318" fill="#facc15" font-size="24" font-weight="800">LAYER A</text>
    <text x="135" y="365" fill="#f6f5f1" font-size="26" font-weight="700">Product + origin</text>
    <text x="135" y="405" fill="#f6f5f1" font-size="22">Physical · stocked</text>
    <rect x="430" y="260" width="270" height="180" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
    <text x="465" y="318" fill="#707178" font-size="24" font-weight="800">LAYER B</text>
    <text x="465" y="365" fill="#131313" font-size="26" font-weight="700">Market + zone</text>
    <text x="465" y="405" fill="#131313" font-size="23">Destination is eligible</text>
    <rect x="760" y="260" width="270" height="180" rx="26" fill="#facc15" stroke="#131313" stroke-width="5"/>
    <text x="795" y="318" fill="#131313" font-size="24" font-weight="800">LAYER C</text>
    <text x="795" y="365" fill="#131313" font-size="26" font-weight="700">Rate condition</text>
    <text x="795" y="405" fill="#131313" font-size="23">Subtotal or weight fits</text>
    <rect x="1090" y="260" width="310" height="180" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
    <text x="1125" y="318" fill="#707178" font-size="24" font-weight="800">LAYER D</text>
    <text x="1125" y="365" fill="#131313" font-size="26" font-weight="700">Carrier or app</text>
    <text x="1125" y="405" fill="#131313" font-size="23">Live quote returns</text>
    <path d="M370 350H420M700 350H750M1030 350H1080" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
    <path d="M401 332L423 350L401 368M731 332L753 350L731 368M1061 332L1083 350L1061 368" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="520" width="1300" height="220" rx="30" fill="#131313"/>
    <text x="150" y="582" fill="#facc15" font-size="25" font-weight="800">DECISION RULE</text>
    <text x="150" y="638" fill="#f6f5f1" font-size="31" font-weight="700">Manual rate missing?</text>
    <text x="520" y="638" fill="#f6f5f1" font-size="27">Fix layers A–C.</text>
    <text x="150" y="690" fill="#f6f5f1" font-size="31" font-weight="700">Live rate missing?</text>
    <text x="520" y="690" fill="#f6f5f1" font-size="27">Prove A–C, then escalate layer D.</text>
    <circle cx="1315" cy="630" r="55" fill="#facc15"/>
    <path d="M1289 630L1310 651L1346 609" fill="none" stroke="#131313" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="812" fill="#707178" font-size="26">Owner follows the first failed layer, not the loudest symptom.</text>
  </g>
</svg>

