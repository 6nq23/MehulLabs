<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify payment pending decision paths</title>
  <desc id="desc">Three cards separate an order payment, a payout, and a customer bank charge before showing the safe next action.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="135" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">Payment pending?</text>
  <text x="110" y="195" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="30">Find where the label appears before moving money or goods.</text>
  <rect x="110" y="275" width="410" height="340" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <circle cx="175" cy="345" r="28" fill="#facc15"/>
  <text x="165" y="356" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">1</text>
  <text x="225" y="355" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Order</text>
  <text x="155" y="430" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26">Payment is not guaranteed.</text>
  <line x1="155" y1="475" x2="475" y2="475" stroke="#707178" stroke-width="3"/>
  <text x="155" y="530" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Hold fulfilment</text>
  <text x="155" y="570" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="23">Check timeline + provider</text>
  <rect x="595" y="275" width="410" height="340" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <circle cx="660" cy="345" r="28" fill="#facc15"/>
  <text x="650" y="356" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">2</text>
  <text x="710" y="355" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Payout</text>
  <text x="640" y="430" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26">Funds were captured.</text>
  <line x1="640" y1="475" x2="960" y2="475" stroke="#707178" stroke-width="3"/>
  <text x="640" y="530" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Reconcile finance</text>
  <text x="640" y="570" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="23">Check payout + bank reference</text>
  <rect x="1080" y="275" width="410" height="340" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <circle cx="1145" cy="345" r="28" fill="#facc15"/>
  <text x="1135" y="356" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">3</text>
  <text x="1195" y="355" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Bank charge</text>
  <text x="1125" y="430" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26">Authorization may reverse.</text>
  <line x1="1125" y1="475" x2="1445" y2="475" stroke="#707178" stroke-width="3"/>
  <text x="1125" y="530" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Match an order</text>
  <text x="1125" y="570" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="23">Check Shopify + customer bank</text>
  <path d="M300 690 H1300" stroke="#131313" stroke-width="4" stroke-linecap="round"/>
  <circle cx="800" cy="690" r="18" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="460" y="770" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">One label. Three different workflows.</text>
</svg>
