<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pending payment decision flow</title>
  <desc id="desc">A flowchart routes a pending label to order, payout, or customer bank evidence and the corresponding action.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="105" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Where does “pending” appear?</text>
  <rect x="570" y="155" width="460" height="105" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="658" y="222" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Locate the label</text>
  <path d="M800 260 V330 M800 330 H270 V380 M800 330 V380 M800 330 H1330 V380" fill="none" stroke="#131313" stroke-width="4"/>
  <rect x="90" y="380" width="360" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="160" y="440" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Order details</text>
  <text x="135" y="488" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Payment not guaranteed</text>
  <rect x="620" y="380" width="360" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="685" y="440" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Payout page</text>
  <text x="676" y="488" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Captured, not scheduled</text>
  <rect x="1150" y="380" width="360" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="1215" y="440" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Customer bank</text>
  <text x="1198" y="488" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Authorization may reverse</text>
  <path d="M270 530 V620 M800 530 V620 M1330 530 V620" stroke="#131313" stroke-width="4"/>
  <polygon points="258,605 282,605 270,625" fill="#131313"/>
  <polygon points="788,605 812,605 800,625" fill="#131313"/>
  <polygon points="1318,605 1342,605 1330,625" fill="#131313"/>
  <rect x="90" y="630" width="360" height="150" rx="24" fill="#131313"/>
  <text x="145" y="693" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Hold + verify</text>
  <text x="140" y="740" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="23">Timeline and provider</text>
  <rect x="620" y="630" width="360" height="150" rx="24" fill="#131313"/>
  <text x="666" y="693" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Reconcile payout</text>
  <text x="672" y="740" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="23">Payout and bank reference</text>
  <rect x="1150" y="630" width="360" height="150" rx="24" fill="#131313"/>
  <text x="1202" y="693" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Match an order</text>
  <text x="1190" y="740" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="23">Shopify and customer bank</text>
  <text x="430" y="850" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Never move goods or request payment from the label alone.</text>
</svg>
