<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify cart drawer decision flow</title>
  <desc id="desc">A diagnostic flow compares the cart request, server cart state, section response, and visible drawer to assign the first failed layer.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="800" y="88" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Trace the first disagreement</text>
  <text x="800" y="132" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">One controlled add separates request, state, markup, and interface failures.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="560" y="180" width="480" height="92" rx="22" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="800" y="237" text-anchor="middle" fill="#131313" font-size="29" font-weight="700">Trigger one known product</text>

    <rect x="90" y="380" width="330" height="140" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="255" y="438" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">No cart request</text>
    <text x="255" y="480" text-anchor="middle" fill="#707178" font-size="23">Trigger or overlay</text>

    <rect x="455" y="380" width="330" height="140" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="620" y="438" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Cart unchanged</text>
    <text x="620" y="480" text-anchor="middle" fill="#707178" font-size="23">Payload or app logic</text>

    <rect x="815" y="380" width="330" height="140" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="980" y="438" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Section is missing</text>
    <text x="980" y="480" text-anchor="middle" fill="#707178" font-size="23">ID or render failure</text>

    <rect x="1180" y="380" width="330" height="140" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1345" y="438" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Drawer stays stale</text>
    <text x="1345" y="480" text-anchor="middle" fill="#707178" font-size="23">Renderer or selector</text>

    <rect x="90" y="650" width="330" height="120" rx="22" fill="#131313"/>
    <text x="255" y="704" text-anchor="middle" fill="#f6f5f1" font-size="25" font-weight="700">Inspect the first error</text>
    <text x="255" y="742" text-anchor="middle" fill="#facc15" font-size="22">Test the native trigger</text>

    <rect x="455" y="650" width="330" height="120" rx="22" fill="#131313"/>
    <text x="620" y="704" text-anchor="middle" fill="#f6f5f1" font-size="25" font-weight="700">Read the response</text>
    <text x="620" y="742" text-anchor="middle" fill="#facc15" font-size="22">Validate submitted state</text>

    <rect x="815" y="650" width="330" height="120" rx="22" fill="#131313"/>
    <text x="980" y="704" text-anchor="middle" fill="#f6f5f1" font-size="25" font-weight="700">Match section IDs</text>
    <text x="980" y="742" text-anchor="middle" fill="#facc15" font-size="22">Handle null markup</text>

    <rect x="1180" y="650" width="330" height="120" rx="22" fill="#131313"/>
    <text x="1345" y="704" text-anchor="middle" fill="#f6f5f1" font-size="25" font-weight="700">Repair one handler</text>
    <text x="1345" y="742" text-anchor="middle" fill="#facc15" font-size="22">Re-run the same cart</text>
  </g>

  <g fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 272v60H255v40"/><path d="M800 332H620v40"/><path d="M800 332h180v40"/><path d="M800 332h545v40"/>
    <path d="M255 520v110"/><path d="M620 520v110"/><path d="M980 520v110"/><path d="M1345 520v110"/>
  </g>
  <g fill="#131313">
    <path d="M241 358l14 22 14-22z"/><path d="M606 358l14 22 14-22z"/><path d="M966 358l14 22 14-22z"/><path d="M1331 358l14 22 14-22z"/>
    <path d="M241 616l14 22 14-22z"/><path d="M606 616l14 22 14-22z"/><path d="M966 616l14 22 14-22z"/><path d="M1331 616l14 22 14-22z"/>
  </g>
</svg>
