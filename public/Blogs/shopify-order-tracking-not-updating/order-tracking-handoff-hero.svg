<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify order tracking handoff</title>
  <desc id="desc">A parcel status moves from carrier scans through Shopify admin to the customer view, with a highlighted broken handoff.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="92" y="88" width="1416" height="724" rx="42" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="140" y="184" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Tracking is a chain of handoffs</text>
  <text x="140" y="238" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Find the first view that stops matching the verified shipment.</text>

  <rect x="140" y="342" width="350" height="250" rx="28" fill="#131313"/>
  <text x="315" y="422" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">CARRIER</text>
  <path d="M238 494h154l-18-38h-118z" fill="#facc15"/>
  <circle cx="270" cy="536" r="22" fill="#f6f5f1"/>
  <circle cx="366" cy="536" r="22" fill="#f6f5f1"/>
  <text x="315" y="646" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Physical scans</text>

  <path d="M520 467h120" stroke="#131313" stroke-width="10" stroke-linecap="round"/>
  <path d="M618 438l34 29-34 29" fill="none" stroke="#131313" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="658" y="342" width="350" height="250" rx="28" fill="#facc15" stroke="#131313" stroke-width="5"/>
  <text x="833" y="422" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">SHOPIFY ADMIN</text>
  <rect x="754" y="466" width="158" height="78" rx="16" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <path d="M784 505h98" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <circle cx="833" cy="467" r="18" fill="#131313"/>
  <text x="833" y="646" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Fulfillment record</text>

  <path d="M1038 467h120" stroke="#facc15" stroke-width="18" stroke-linecap="round"/>
  <path d="M1136 430l42 37-42 37" fill="none" stroke="#131313" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1098" cy="467" r="28" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="1098" y="477" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">!</text>

  <rect x="1180" y="342" width="280" height="250" rx="28" fill="#131313"/>
  <text x="1320" y="414" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">CUSTOMER</text>
  <rect x="1260" y="454" width="120" height="88" rx="14" fill="#f6f5f1"/>
  <path d="M1284 480h72M1284 505h52" stroke="#131313" stroke-width="7" stroke-linecap="round"/>
  <text x="1320" y="646" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Order status</text>

  <rect x="430" y="706" width="740" height="58" rx="29" fill="#facc15"/>
  <text x="800" y="745" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Carrier truth → Shopify record → customer view</text>
</svg>
