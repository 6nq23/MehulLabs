<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tracking truth decision flow</title>
  <desc id="desc">A decision flow checks the carrier page first, then Shopify admin, then the customer view to assign ownership of a stale tracking update.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="108" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">Where did the tracking update stop?</text>
  <text x="110" y="158" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">Compare the same shipment in sequence. Stop at the first mismatch.</text>

  <rect x="110" y="240" width="370" height="190" rx="28" fill="#131313"/>
  <text x="295" y="304" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">CARRIER PAGE</text>
  <text x="295" y="354" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25">Is there a real event?</text>
  <text x="295" y="394" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Scan, exception, or delivery</text>

  <path d="M480 335h135" stroke="#131313" stroke-width="9" stroke-linecap="round"/>
  <path d="M592 307l32 28-32 28" fill="none" stroke="#131313" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="303" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">YES</text>

  <rect x="625" y="240" width="370" height="190" rx="28" fill="#facc15" stroke="#131313" stroke-width="5"/>
  <text x="810" y="304" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">SHOPIFY ADMIN</text>
  <text x="810" y="354" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25">Does fulfillment match?</text>
  <text x="810" y="394" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Number, carrier, URL, status</text>

  <path d="M995 335h135" stroke="#131313" stroke-width="9" stroke-linecap="round"/>
  <path d="M1107 307l32 28-32 28" fill="none" stroke="#131313" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1063" y="303" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">YES</text>

  <rect x="1140" y="240" width="350" height="190" rx="28" fill="#131313"/>
  <text x="1315" y="304" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">CUSTOMER VIEW</text>
  <text x="1315" y="354" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25">Does the link match?</text>
  <text x="1315" y="394" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Status page and email</text>

  <path d="M295 430v105" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <path d="M267 512l28 32 28-32" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="494" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">NO</text>
  <rect x="120" y="552" width="350" height="190" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="295" y="614" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">WAREHOUSE / CARRIER</text>
  <text x="295" y="661" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Confirm handoff and scan</text>
  <text x="295" y="696" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Follow local enquiry rules</text>

  <path d="M810 430v105" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <path d="M782 512l28 32 28-32" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="847" y="494" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">NO</text>
  <rect x="635" y="552" width="350" height="190" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="810" y="614" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">APP / SHOPIFY SETUP</text>
  <text x="810" y="661" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Fix carrier mapping</text>
  <text x="810" y="696" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Escalate with one order</text>

  <path d="M1315 430v105" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
  <path d="M1287 512l28 32 28-32" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1352" y="494" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">NO</text>
  <rect x="1140" y="552" width="350" height="190" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="1315" y="614" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">PAGE / NOTIFICATION</text>
  <text x="1315" y="661" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Test the customer link</text>
  <text x="1315" y="696" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Repair template access</text>

  <rect x="470" y="798" width="660" height="58" rx="29" fill="#facc15"/>
  <text x="800" y="836" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">One mismatch → one owner → one next check date</text>
</svg>
