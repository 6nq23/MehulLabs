<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">From bundle list value to contribution per order</title><desc id="d">Waterfall for the worked example: list value 1,000, minus a 10% discount, gives a 900 selling price; minus 450 product costs leaves a 450 product-level margin; minus 190 of other variable costs leaves 260 contribution.</desc>
<rect width="1600" height="900" fill="#f6f5f1"/>
<g font-family="Inter, Arial, sans-serif" fill="#131313">
<text x="80" y="100" font-size="24" font-weight="700" letter-spacing="3" fill="#707178">WORKED BUNDLE EXAMPLE</text><text x="80" y="160" font-size="48" font-weight="700">From list value to contribution per order</text><text x="80" y="268" font-size="26">Bundle list value</text><rect x="640" y="230" width="780" height="56" rx="6" fill="#facc15"/><text x="1436" y="268" font-size="26" font-weight="700">₹1,000</text><text x="80" y="350" font-size="26">Discount (10%)</text><rect x="1342" y="312" width="78" height="56" rx="6" fill="#c2410c"/><text x="1436" y="350" font-size="26" font-weight="700">−₹100</text><text x="80" y="432" font-size="26">Bundle selling price</text><rect x="640" y="394" width="702" height="56" rx="6" fill="#131313"/><text x="1358" y="432" font-size="26" font-weight="700">₹900</text><text x="80" y="514" font-size="26">Product costs (COGS)</text><rect x="991" y="476" width="351" height="56" rx="6" fill="#c2410c"/><text x="1358" y="514" font-size="26" font-weight="700">−₹450</text><text x="80" y="596" font-size="26">Product-level margin (50%)</text><rect x="640" y="558" width="351" height="56" rx="6" fill="#facc15"/><text x="1007" y="596" font-size="26" font-weight="700">₹450</text><text x="80" y="678" font-size="26">Fulfilment, fees, returns, acquisition</text><rect x="843" y="640" width="148" height="56" rx="6" fill="#c2410c"/><text x="1007" y="678" font-size="26" font-weight="700">−₹190</text><text x="80" y="760" font-size="26">Contribution per bundle order</text><rect x="640" y="722" width="203" height="56" rx="6" fill="#131313"/><text x="859" y="760" font-size="26" font-weight="700">₹260</text><line x1="640" y1="215" x2="640" y2="804" stroke="#d9d5cb" stroke-width="2"/><text x="80" y="850" font-size="22" fill="#707178">Illustrative inputs from the worked example in this guide, not benchmarks.</text><text x="1520" y="850" font-size="22" font-weight="700" text-anchor="end">MlabsGrowth</text>
</g>
</svg>
