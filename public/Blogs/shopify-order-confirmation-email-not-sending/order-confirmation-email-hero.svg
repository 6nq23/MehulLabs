<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify order confirmation email diagnostic</title>
  <desc id="desc">An order card moves through contact, timeline, delivery, and inbox checks before reaching a confirmed message.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="90" y="82" width="1420" height="736" rx="42" fill="none" stroke="#131313" stroke-width="4"/>
  <rect x="90" y="82" width="22" height="736" rx="11" fill="#facc15"/>
  <text x="165" y="205" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700">Order confirmed.</text>
  <text x="165" y="278" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700">Email missing.</text>
  <text x="165" y="354" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="30">Trace the evidence before changing anything.</text>
  <rect x="165" y="436" width="430" height="214" rx="28" fill="#131313"/>
  <text x="205" y="490" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">ORDER RECORD</text>
  <line x1="205" y1="526" x2="555" y2="526" stroke="#707178" stroke-width="3"/>
  <text x="205" y="572" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="27">Contact captured</text>
  <text x="205" y="616" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="27">Timeline inspected</text>
  <circle cx="552" cy="570" r="12" fill="#facc15"/>
  <circle cx="552" cy="614" r="12" fill="#facc15"/>
  <path d="M650 545 H720" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round"/>
  <path d="M704 529 L724 545 L704 561" fill="none" stroke="#131313" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="760" y="176" width="620" height="124" rx="26" fill="none" stroke="#131313" stroke-width="4"/>
    <circle cx="820" cy="238" r="30" fill="#facc15"/>
    <text x="810" y="248" fill="#131313" font-size="26" font-weight="700">1</text>
    <text x="872" y="230" fill="#131313" font-size="30" font-weight="700">Order and contact</text>
    <text x="872" y="266" fill="#707178" font-size="24">Does the order contain the expected email?</text>
    <rect x="760" y="336" width="620" height="124" rx="26" fill="none" stroke="#131313" stroke-width="4"/>
    <circle cx="820" cy="398" r="30" fill="#facc15"/>
    <text x="810" y="408" fill="#131313" font-size="26" font-weight="700">2</text>
    <text x="872" y="390" fill="#131313" font-size="30" font-weight="700">Timeline event</text>
    <text x="872" y="426" fill="#707178" font-size="24">Was a confirmation notification created?</text>
    <rect x="760" y="496" width="620" height="124" rx="26" fill="none" stroke="#131313" stroke-width="4"/>
    <circle cx="820" cy="558" r="30" fill="#facc15"/>
    <text x="810" y="568" fill="#131313" font-size="26" font-weight="700">3</text>
    <text x="872" y="550" fill="#131313" font-size="30" font-weight="700">Delivery and inbox</text>
    <text x="872" y="586" fill="#707178" font-size="24">Did the server accept and place the message?</text>
  </g>
  <rect x="760" y="660" width="620" height="76" rx="38" fill="#facc15"/>
  <text x="1070" y="708" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">FIRST FAILED CHECK = NEXT OWNER</text>
</svg>
