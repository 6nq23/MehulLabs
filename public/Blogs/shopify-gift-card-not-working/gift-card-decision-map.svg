<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify gift card decision map</title>
  <desc id="desc">A flow diagram separates missing card records, delivery failures, hidden checkout fields, and rejected codes.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="104" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">Start with the symptom, not a replacement</text>
  <text x="100" y="150" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="25">Each outcome points to a different owner and test.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="100" y="210" width="1400" height="118" rx="28" fill="#131313"/>
    <text x="800" y="260" fill="#f6f5f1" font-size="30" font-weight="700" text-anchor="middle">Does an active gift-card record exist?</text>
    <text x="800" y="299" fill="#facc15" font-size="24" text-anchor="middle">Check fulfillment, balance, expiry, and last code characters</text>

    <path d="M800 328 V386 M800 386 H325 V430 M800 386 H800 V430 M800 386 H1275 V430" fill="none" stroke="#707178" stroke-width="6" stroke-linecap="round"/>
    <text x="386" y="376" fill="#707178" font-size="22">NO</text>
    <text x="829" y="376" fill="#707178" font-size="22">YES</text>

    <rect x="100" y="430" width="450" height="224" rx="28" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="325" y="482" fill="#131313" font-size="28" font-weight="700" text-anchor="middle">Record missing</text>
    <text x="140" y="530" fill="#131313" font-size="23">• Verify gift-card product type</text>
    <text x="140" y="568" fill="#131313" font-size="23">• Review payment risk</text>
    <text x="140" y="606" fill="#131313" font-size="23">• Fulfill the correct line</text>

    <rect x="575" y="430" width="450" height="224" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="800" y="482" fill="#131313" font-size="28" font-weight="700" text-anchor="middle">Card exists, email missing</text>
    <text x="615" y="530" fill="#131313" font-size="23">• Confirm recipient fields</text>
    <text x="615" y="568" fill="#131313" font-size="23">• Check scheduled delivery</text>
    <text x="615" y="606" fill="#131313" font-size="23">• Resend the same card</text>

    <rect x="1050" y="430" width="450" height="224" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1275" y="482" fill="#131313" font-size="28" font-weight="700" text-anchor="middle">Code reaches checkout</text>
    <text x="1090" y="530" fill="#131313" font-size="23">• Match market and currency</text>
    <text x="1090" y="568" fill="#131313" font-size="23">• Read the exact error</text>
    <text x="1090" y="606" fill="#131313" font-size="23">• Compare a clean theme</text>

    <path d="M325 654 V726 M800 654 V726 M1275 654 V726" fill="none" stroke="#707178" stroke-width="6" stroke-linecap="round"/>
    <rect x="100" y="726" width="1400" height="92" rx="26" fill="#131313"/>
    <text x="800" y="764" fill="#f6f5f1" font-size="26" font-weight="700" text-anchor="middle">Retest the original route and save the evidence</text>
    <text x="800" y="796" fill="#facc15" font-size="22" text-anchor="middle">Order • status • currency • message • theme • result</text>
  </g>
</svg>
