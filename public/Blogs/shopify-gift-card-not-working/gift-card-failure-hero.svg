<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify gift card failure path</title>
  <desc id="desc">A gift card travels through record, delivery, and checkout checks before successful redemption.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="72" y="72" width="1456" height="756" rx="36" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="132" y="178" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="700">Gift card not working?</text>
  <text x="132" y="232" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Find the first failed state before replacing the code.</text>
  <path d="M210 510 H1380" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="260" cy="510" r="78" fill="#facc15" stroke="#131313" stroke-width="5"/>
    <text x="260" y="500" fill="#131313" font-size="27" font-weight="700">CARD</text>
    <text x="260" y="534" fill="#131313" font-size="27" font-weight="700">RECORD</text>
    <text x="260" y="638" fill="#707178" font-size="24">Active and funded?</text>

    <circle cx="620" cy="510" r="78" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
    <text x="620" y="500" fill="#131313" font-size="27" font-weight="700">EMAIL</text>
    <text x="620" y="534" fill="#131313" font-size="27" font-weight="700">DELIVERY</text>
    <text x="620" y="638" fill="#707178" font-size="24">Right recipient?</text>

    <circle cx="980" cy="510" r="78" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
    <text x="980" y="500" fill="#131313" font-size="27" font-weight="700">CHECKOUT</text>
    <text x="980" y="534" fill="#131313" font-size="27" font-weight="700">FIELD</text>
    <text x="980" y="638" fill="#707178" font-size="24">Visible and native?</text>

    <circle cx="1340" cy="510" r="78" fill="#131313" stroke="#131313" stroke-width="5"/>
    <path d="M1305 510 l22 22 48 -54" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1340" y="638" fill="#707178" font-size="24">Redeemed</text>
  </g>
  <rect x="128" y="716" width="1344" height="60" rx="30" fill="#131313"/>
  <text x="800" y="756" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Record the symptom • test one route • keep the original evidence</text>
</svg>
