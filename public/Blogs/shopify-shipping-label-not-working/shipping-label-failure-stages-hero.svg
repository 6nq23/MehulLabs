<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify shipping label failure stages</title>
  <desc id="desc">A shipping label moves through eligibility, carrier, purchase, PDF, and print stages, with a yellow marker showing where to locate the failure.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="92" y="72" width="1416" height="756" rx="38" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="150" y="180" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">Find the failed stage first</text>
  <text x="150" y="238" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="30">A label problem changes owner as it moves from the order to the printer.</text>

  <path d="M210 486 H1370" fill="none" stroke="#707178" stroke-width="10" stroke-linecap="round"/>
  <path d="M1338 456 L1382 486 L1338 516" fill="none" stroke="#707178" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="144" y="384" width="236" height="204" rx="28" fill="#131313"/>
    <text x="262" y="474" fill="#f6f5f1" font-size="30" font-weight="700">Eligibility</text>
    <text x="262" y="520" fill="#f6f5f1" font-size="24">button visible?</text>

    <rect x="414" y="384" width="236" height="204" rx="28" fill="#131313"/>
    <text x="532" y="474" fill="#f6f5f1" font-size="30" font-weight="700">Carrier</text>
    <text x="532" y="520" fill="#f6f5f1" font-size="24">service listed?</text>

    <rect x="684" y="354" width="236" height="264" rx="28" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="802" y="458" fill="#131313" font-size="30" font-weight="800">Purchase</text>
    <text x="802" y="504" fill="#131313" font-size="24">charge complete?</text>
    <text x="802" y="560" fill="#131313" font-size="24" font-weight="700">Locate the break</text>

    <rect x="954" y="384" width="236" height="204" rx="28" fill="#131313"/>
    <text x="1072" y="474" fill="#f6f5f1" font-size="30" font-weight="700">PDF</text>
    <text x="1072" y="520" fill="#f6f5f1" font-size="24">file usable?</text>

    <rect x="1224" y="384" width="236" height="204" rx="28" fill="#131313"/>
    <text x="1342" y="474" fill="#f6f5f1" font-size="30" font-weight="700">Print</text>
    <text x="1342" y="520" fill="#f6f5f1" font-size="24">output correct?</text>
  </g>

  <rect x="150" y="690" width="1300" height="80" rx="20" fill="#131313"/>
  <text x="800" y="741" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Change only the data owned by the failed stage.</text>
</svg>
