<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shipping label stage decision map</title>
  <desc id="desc">A decision flow routes missing buttons, missing carriers, rejected purchases, unusable PDF files, and print defects to the correct owner and next action.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="112" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">Trace the last confirmed success</text>
  <text x="110" y="162" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Move right only after each stage passes. Stop where the evidence changes.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="236" width="264" height="166" rx="24" fill="#131313"/>
    <text x="242" y="300" text-anchor="middle" fill="#f6f5f1" font-size="29" font-weight="700">Button exists</text>
    <text x="242" y="344" text-anchor="middle" fill="#f6f5f1" font-size="23">Order is eligible</text>
    <text x="242" y="375" text-anchor="middle" fill="#f6f5f1" font-size="23">and unfulfilled</text>

    <rect x="414" y="236" width="264" height="166" rx="24" fill="#131313"/>
    <text x="546" y="300" text-anchor="middle" fill="#f6f5f1" font-size="29" font-weight="700">Service appears</text>
    <text x="546" y="344" text-anchor="middle" fill="#f6f5f1" font-size="23">Carrier accepts</text>
    <text x="546" y="375" text-anchor="middle" fill="#f6f5f1" font-size="23">this shipment</text>

    <rect x="718" y="216" width="264" height="206" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="850" y="276" text-anchor="middle" fill="#131313" font-size="29" font-weight="800">Purchase</text>
    <text x="850" y="312" text-anchor="middle" fill="#131313" font-size="29" font-weight="800">completes</text>
    <text x="850" y="356" text-anchor="middle" fill="#131313" font-size="23">Billing and bank</text>
    <text x="850" y="387" text-anchor="middle" fill="#131313" font-size="23">authentication pass</text>

    <rect x="1022" y="236" width="214" height="166" rx="24" fill="#131313"/>
    <text x="1129" y="300" text-anchor="middle" fill="#f6f5f1" font-size="29" font-weight="700">PDF opens</text>
    <text x="1129" y="344" text-anchor="middle" fill="#f6f5f1" font-size="23">File exists and</text>
    <text x="1129" y="375" text-anchor="middle" fill="#f6f5f1" font-size="23">renders correctly</text>

    <rect x="1276" y="236" width="214" height="166" rx="24" fill="#131313"/>
    <text x="1383" y="300" text-anchor="middle" fill="#f6f5f1" font-size="29" font-weight="700">Print works</text>
    <text x="1383" y="344" text-anchor="middle" fill="#f6f5f1" font-size="23">Format, scale,</text>
    <text x="1383" y="375" text-anchor="middle" fill="#f6f5f1" font-size="23">driver, media</text>
  </g>

  <g fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 319 H402"/><path d="M390 306 L406 319 L390 332"/>
    <path d="M678 319 H706"/><path d="M694 306 L710 319 L694 332"/>
    <path d="M982 319 H1010"/><path d="M998 306 L1014 319 L998 332"/>
    <path d="M1236 319 H1264"/><path d="M1252 306 L1268 319 L1252 332"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <path d="M242 402 V520" fill="none" stroke="#707178" stroke-width="5"/>
    <path d="M546 402 V520" fill="none" stroke="#707178" stroke-width="5"/>
    <path d="M850 422 V520" fill="none" stroke="#707178" stroke-width="5"/>
    <path d="M1129 402 V520" fill="none" stroke="#707178" stroke-width="5"/>
    <path d="M1383 402 V520" fill="none" stroke="#707178" stroke-width="5"/>

    <rect x="110" y="520" width="264" height="194" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="242" y="580" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Store or support</text>
    <text x="242" y="625" text-anchor="middle" fill="#707178" font-size="23">Check fulfillment,</text>
    <text x="242" y="658" text-anchor="middle" fill="#707178" font-size="23">location, balance</text>

    <rect x="414" y="520" width="264" height="194" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="546" y="580" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Operations</text>
    <text x="546" y="625" text-anchor="middle" fill="#707178" font-size="23">Check route, carrier,</text>
    <text x="546" y="658" text-anchor="middle" fill="#707178" font-size="23">package, address</text>

    <rect x="718" y="520" width="264" height="194" rx="24" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="850" y="580" text-anchor="middle" fill="#131313" font-size="27" font-weight="800">Billing owner</text>
    <text x="850" y="625" text-anchor="middle" fill="#131313" font-size="23">Finish authentication;</text>
    <text x="850" y="658" text-anchor="middle" fill="#131313" font-size="23">confirm label record</text>

    <rect x="1022" y="520" width="214" height="194" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1129" y="580" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Browser owner</text>
    <text x="1129" y="625" text-anchor="middle" fill="#707178" font-size="23">Download, popup,</text>
    <text x="1129" y="658" text-anchor="middle" fill="#707178" font-size="23">viewer, device</text>

    <rect x="1276" y="520" width="214" height="194" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1383" y="580" text-anchor="middle" fill="#131313" font-size="27" font-weight="700">Warehouse</text>
    <text x="1383" y="625" text-anchor="middle" fill="#707178" font-size="23">Match paper and</text>
    <text x="1383" y="658" text-anchor="middle" fill="#707178" font-size="23">print settings</text>
  </g>

  <rect x="110" y="774" width="1380" height="70" rx="18" fill="#131313"/>
  <text x="800" y="819" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">If the shipment must leave, use an eligible fallback and record its tracking on the order.</text>
</svg>
