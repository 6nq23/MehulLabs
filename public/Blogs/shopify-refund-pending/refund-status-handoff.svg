<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Refund status and ownership flow</title>
  <desc id="desc">A flowchart routes pending, failed, and processed refund states to the correct owner and next action.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="105" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">FOLLOW THE REFUND EVIDENCE</text>
  <text x="100" y="153" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="26">The status decides the owner. The owner decides the next action.</text>
  <rect x="100" y="220" width="400" height="150" rx="26" fill="#131313"/>
  <text x="300" y="280" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">ORDER TIMELINE</text>
  <text x="300" y="326" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">status + route + reference</text>
  <line x1="500" y1="295" x2="650" y2="295" stroke="#131313" stroke-width="7"/>
  <polygon points="650,295 616,275 616,315" fill="#131313"/>
  <rect x="650" y="220" width="360" height="150" rx="26" fill="#facc15" stroke="#131313" stroke-width="6"/>
  <text x="830" y="280" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">PROVIDER RECORD</text>
  <text x="830" y="326" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">confirm the current state</text>
  <line x1="830" y1="370" x2="830" y2="460" stroke="#131313" stroke-width="7"/>
  <line x1="300" y1="460" x2="1300" y2="460" stroke="#131313" stroke-width="7"/>
  <line x1="300" y1="460" x2="300" y2="540" stroke="#131313" stroke-width="7"/>
  <line x1="830" y1="460" x2="830" y2="540" stroke="#131313" stroke-width="7"/>
  <line x1="1300" y1="460" x2="1300" y2="540" stroke="#131313" stroke-width="7"/>
  <rect x="100" y="540" width="400" height="220" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="300" y="602" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">PENDING</text>
  <text x="300" y="652" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Check balance and deadline</text>
  <text x="300" y="698" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Owner: store or support</text>
  <rect x="630" y="540" width="400" height="220" rx="28" fill="#131313"/>
  <text x="830" y="602" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">FAILED</text>
  <text x="830" y="652" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="24">Resolve the exact error</text>
  <text x="830" y="698" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="24">Owner: payment provider</text>
  <rect x="1160" y="540" width="340" height="220" rx="28" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="1330" y="602" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">PROCESSED</text>
  <text x="1330" y="652" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="24">Share trace reference</text>
  <text x="1330" y="698" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">Owner: customer bank</text>
</svg>
