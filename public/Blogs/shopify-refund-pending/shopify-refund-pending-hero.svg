<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify refund pending status handoff</title>
  <desc id="desc">A refund request moves through Shopify, a payment provider, and the customer bank, with the pending stage highlighted.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <rect x="88" y="84" width="1424" height="732" rx="38" fill="#f6f5f1" stroke="#131313" stroke-width="6"/>
  <text x="150" y="180" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">SHOPIFY REFUND PENDING</text>
  <text x="150" y="235" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Find the handoff before you retry the refund.</text>
  <line x1="320" y1="465" x2="1280" y2="465" stroke="#131313" stroke-width="8"/>
  <polygon points="1280,465 1240,442 1240,488" fill="#131313"/>
  <circle cx="320" cy="465" r="92" fill="#f6f5f1" stroke="#131313" stroke-width="7"/>
  <circle cx="800" cy="465" r="112" fill="#facc15" stroke="#131313" stroke-width="7"/>
  <circle cx="1280" cy="465" r="92" fill="#f6f5f1" stroke="#131313" stroke-width="7"/>
  <text x="320" y="452" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">REFUND</text>
  <text x="320" y="488" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">REQUESTED</text>
  <text x="800" y="455" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">PENDING</text>
  <text x="800" y="495" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="24">check the evidence</text>
  <text x="1280" y="452" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">BANK</text>
  <text x="1280" y="488" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">POSTED</text>
  <rect x="174" y="650" width="1252" height="92" rx="22" fill="#131313"/>
  <text x="800" y="708" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Timeline → provider → balance → bank reference</text>
</svg>
