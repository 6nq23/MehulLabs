<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Search first-failure decision flow</title>
  <desc id="desc">A decision flow compares product visibility, native preview, submitted results, and predictive search to assign the repair owner.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <g font-family="Inter, Arial, sans-serif" fill="#131313">
    <text x="100" y="105" font-size="58" font-weight="700">Find the first failed search view</text>
    <text x="102" y="158" font-size="27" fill="#707178">Use the same query, product, market, language, device, and theme.</text>
    <rect x="110" y="240" width="300" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <rect x="485" y="240" width="300" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <rect x="860" y="240" width="300" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <rect x="1235" y="240" width="255" height="150" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="260" y="298" text-anchor="middle" font-size="28" font-weight="700">Product visible?</text>
    <text x="260" y="342" text-anchor="middle" font-size="22" fill="#707178">Published and available</text>
    <text x="635" y="298" text-anchor="middle" font-size="28" font-weight="700">Preview finds it?</text>
    <text x="635" y="342" text-anchor="middle" font-size="22" fill="#707178">Native result control</text>
    <text x="1010" y="298" text-anchor="middle" font-size="28" font-weight="700">Page finds it?</text>
    <text x="1010" y="342" text-anchor="middle" font-size="22" fill="#707178">Submitted query</text>
    <text x="1362" y="298" text-anchor="middle" font-size="28" font-weight="700">Dropdown works?</text>
    <text x="1362" y="342" text-anchor="middle" font-size="22" fill="#707178">Predictive view</text>
    <path d="M420 315H465M795 315H840M1170 315H1215" stroke="#131313" stroke-width="7" stroke-linecap="round"/>
    <path d="M445 294L470 315L445 336M820 294L845 315L820 336M1195 294L1220 315L1195 336" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M260 400V520M635 400V520M1010 400V520M1362 400V520" stroke="#707178" stroke-width="6" stroke-dasharray="12 12"/>
    <rect x="110" y="520" width="300" height="145" rx="22" fill="#facc15"/>
    <rect x="485" y="520" width="300" height="145" rx="22" fill="#facc15"/>
    <rect x="860" y="520" width="300" height="145" rx="22" fill="#facc15"/>
    <rect x="1235" y="520" width="255" height="145" rx="22" fill="#facc15"/>
    <text x="260" y="578" text-anchor="middle" font-size="27" font-weight="700">Catalog owner</text>
    <text x="260" y="620" text-anchor="middle" font-size="22">Visibility and availability</text>
    <text x="635" y="578" text-anchor="middle" font-size="27" font-weight="700">Search owner</text>
    <text x="635" y="620" text-anchor="middle" font-size="22">Native settings or index</text>
    <text x="1010" y="578" text-anchor="middle" font-size="27" font-weight="700">Theme or app owner</text>
    <text x="1010" y="620" text-anchor="middle" font-size="22">Request and results template</text>
    <text x="1362" y="578" text-anchor="middle" font-size="27" font-weight="700">UI owner</text>
    <text x="1362" y="620" text-anchor="middle" font-size="22">Request and renderer</text>
    <rect x="250" y="740" width="1100" height="90" rx="22" fill="#131313"/>
    <text x="800" y="796" text-anchor="middle" font-size="28" font-weight="700" fill="#f6f5f1">Stop at the first failure. Preserve the passing views as controls.</text>
  </g>
</svg>
