<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify storefront search layer diagnostic</title>
  <desc id="desc">A search query travels through catalog, native search, and storefront presentation layers to a visible product result.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <g font-family="Inter, Arial, sans-serif" fill="#131313">
    <text x="110" y="135" font-size="64" font-weight="700">Where did storefront search break?</text>
    <text x="112" y="190" font-size="28" fill="#707178">Keep one query and one expected product fixed. Compare each handoff.</text>
    <rect x="110" y="290" width="350" height="290" rx="30" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <rect x="625" y="290" width="350" height="290" rx="30" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <rect x="1140" y="290" width="350" height="290" rx="30" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <circle cx="285" cy="360" r="44" fill="#facc15"/>
    <circle cx="800" cy="360" r="44" fill="#facc15"/>
    <circle cx="1315" cy="360" r="44" fill="#facc15"/>
    <text x="285" y="369" text-anchor="middle" font-size="28" font-weight="700">A</text>
    <text x="800" y="369" text-anchor="middle" font-size="28" font-weight="700">B</text>
    <text x="1315" y="369" text-anchor="middle" font-size="28" font-weight="700">C</text>
    <text x="285" y="455" text-anchor="middle" font-size="36" font-weight="700">Catalog</text>
    <text x="285" y="505" text-anchor="middle" font-size="24" fill="#707178">Active, published, visible</text>
    <text x="800" y="455" text-anchor="middle" font-size="36" font-weight="700">Native search</text>
    <text x="800" y="505" text-anchor="middle" font-size="24" fill="#707178">Preview and result data</text>
    <text x="1315" y="455" text-anchor="middle" font-size="36" font-weight="700">Storefront</text>
    <text x="1315" y="505" text-anchor="middle" font-size="24" fill="#707178">Theme, app, or custom UI</text>
    <path d="M470 435H605" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
    <path d="M580 410L610 435L580 460" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M985 435H1120" stroke="#131313" stroke-width="8" stroke-linecap="round"/>
    <path d="M1095 410L1125 435L1095 460" fill="none" stroke="#131313" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="310" y="690" width="980" height="105" rx="24" fill="#facc15"/>
    <text x="800" y="735" text-anchor="middle" font-size="30" font-weight="700">The first failed comparison owns the next repair.</text>
    <text x="800" y="772" text-anchor="middle" font-size="23" fill="#131313">Do not change every layer at once.</text>
  </g>
</svg>
