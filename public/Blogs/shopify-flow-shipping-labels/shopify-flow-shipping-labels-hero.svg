<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Flow shipping label automation</title>
  <desc id="desc">A Shopify order passes eligibility, package, weight, and service checks before a shipping label is purchased and sent to a print queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.58" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f2efe7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#241f16" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#6f685e"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1460" cy="95" r="220" fill="#ffcb16" opacity="0.26"/>
  <circle cx="125" cy="830" r="270" fill="#ff9d2e" opacity="0.1"/>

  <g font-family="Inter, Arial, sans-serif" fill="#24221f">
    <text x="110" y="118" font-size="30" font-weight="800" letter-spacing="3">SHOPIFY FLOW · ORDER OPERATIONS</text>
    <text x="110" y="190" font-size="62" font-weight="850">Shipping labels, with guardrails</text>
    <text x="110" y="242" font-size="30" fill="#655f55">Check the order before the workflow buys the label.</text>

    <g filter="url(#shadow)">
      <rect x="105" y="350" width="310" height="265" rx="30" fill="url(#card)" stroke="#ded8ca" stroke-width="3"/>
      <rect x="515" y="350" width="560" height="265" rx="30" fill="#ffffff" stroke="#ded8ca" stroke-width="3"/>
      <rect x="1175" y="350" width="320" height="265" rx="30" fill="#24221f"/>
    </g>

    <g>
      <rect x="150" y="397" width="72" height="82" rx="14" fill="#ffcb16"/>
      <path d="M168 418h37M168 436h27M168 454h31" stroke="#24221f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="526" font-size="30" font-weight="850">Eligible order</text>
      <text x="150" y="565" font-size="22" fill="#655f55">Ready to fulfill</text>
    </g>

    <path d="M415 482h100" stroke="#6f685e" stroke-width="5" marker-end="url(#arrow)"/>

    <g>
      <text x="565" y="405" font-size="24" font-weight="800" fill="#8a5a00">FLOW CONDITIONS</text>
      <g font-size="23" font-weight="750">
        <circle cx="584" cy="462" r="18" fill="#ffcb16"/><path d="M575 462l7 7 13-16" fill="none" stroke="#24221f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="620" y="470">Fulfillment service</text>
        <circle cx="824" cy="462" r="18" fill="#ffcb16"/><path d="M815 462l7 7 13-16" fill="none" stroke="#24221f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="860" y="470">Package</text>
        <circle cx="584" cy="528" r="18" fill="#ffcb16"/><path d="M575 528l7 7 13-16" fill="none" stroke="#24221f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="620" y="536">Weight</text>
        <circle cx="824" cy="528" r="18" fill="#ffcb16"/><path d="M815 528l7 7 13-16" fill="none" stroke="#24221f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="860" y="536">Service</text>
      </g>
      <rect x="565" y="570" width="460" height="4" rx="2" fill="#ece6da"/>
    </g>

    <path d="M1075 482h100" stroke="#6f685e" stroke-width="5" marker-end="url(#arrow)"/>

    <g fill="#ffffff">
      <path d="M1230 405h205v128H1230z" fill="#ffffff" rx="10"/>
      <path d="M1260 438h145M1260 467h105M1260 497h128" stroke="#24221f" stroke-width="7" stroke-linecap="round"/>
      <text x="1230" y="570" font-size="30" font-weight="850">Label purchased</text>
    </g>

    <rect x="315" y="713" width="970" height="92" rx="46" fill="#ffcb16"/>
    <text x="800" y="771" text-anchor="middle" font-size="29" font-weight="850">Pass → buy and print · Fail → leave untouched and review</text>
  </g>
</svg>
