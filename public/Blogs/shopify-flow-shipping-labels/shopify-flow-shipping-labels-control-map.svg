<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Six-step Shopify Flow shipping label launch map</title>
  <desc id="desc">A six-step sequence covers eligibility, shipment data, a narrow rule, dry testing, a live pilot, and monitoring with exceptions routed to a human review queue.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f4f1e9"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#241f16" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#7a7267"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg2)"/>
  <g font-family="Inter, Arial, sans-serif" fill="#24221f">
    <text x="100" y="104" font-size="30" font-weight="800" letter-spacing="3">SAFE AUTOMATION LAUNCH</text>
    <text x="100" y="174" font-size="54" font-weight="850">Six gates before broad activation</text>
    <text x="100" y="224" font-size="27" fill="#655f55">Every failed gate sends the order to review, not to label purchase.</text>

    <g filter="url(#shadow2)">
      <rect x="95" y="315" width="215" height="245" rx="28" fill="#ffffff" stroke="#ddd7cb" stroke-width="3"/>
      <rect x="335" y="315" width="215" height="245" rx="28" fill="#ffffff" stroke="#ddd7cb" stroke-width="3"/>
      <rect x="575" y="315" width="215" height="245" rx="28" fill="#ffffff" stroke="#ddd7cb" stroke-width="3"/>
      <rect x="815" y="315" width="215" height="245" rx="28" fill="#ffffff" stroke="#ddd7cb" stroke-width="3"/>
      <rect x="1055" y="315" width="215" height="245" rx="28" fill="#ffffff" stroke="#ddd7cb" stroke-width="3"/>
      <rect x="1295" y="315" width="215" height="245" rx="28" fill="#24221f"/>
    </g>

    <path d="M310 436h25M550 436h25M790 436h25M1030 436h25M1270 436h25" stroke="#7a7267" stroke-width="5" marker-end="url(#arrow2)"/>

    <g>
      <rect x="125" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="153" y="389" text-anchor="middle" font-size="26" font-weight="900">1</text>
      <text x="125" y="458" font-size="25" font-weight="850">Eligibility</text>
      <text x="125" y="497" font-size="19" fill="#655f55">Location</text>
      <text x="125" y="526" font-size="19" fill="#655f55">Fulfillment service</text>
    </g>
    <g>
      <rect x="365" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="393" y="389" text-anchor="middle" font-size="26" font-weight="900">2</text>
      <text x="365" y="458" font-size="25" font-weight="850">Data</text>
      <text x="365" y="497" font-size="19" fill="#655f55">Package</text>
      <text x="365" y="526" font-size="19" fill="#655f55">Weight · address</text>
    </g>
    <g>
      <rect x="605" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="633" y="389" text-anchor="middle" font-size="26" font-weight="900">3</text>
      <text x="605" y="458" font-size="25" font-weight="850">Narrow rule</text>
      <text x="605" y="497" font-size="19" fill="#655f55">One segment</text>
      <text x="605" y="526" font-size="19" fill="#655f55">One known service</text>
    </g>
    <g>
      <rect x="845" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="873" y="389" text-anchor="middle" font-size="26" font-weight="900">4</text>
      <text x="845" y="458" font-size="25" font-weight="850">Dry test</text>
      <text x="845" y="497" font-size="19" fill="#655f55">Pass case</text>
      <text x="845" y="526" font-size="19" fill="#655f55">Fail case</text>
    </g>
    <g>
      <rect x="1085" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="1113" y="389" text-anchor="middle" font-size="26" font-weight="900">5</text>
      <text x="1085" y="458" font-size="25" font-weight="850">Live pilot</text>
      <text x="1085" y="497" font-size="19" fill="#655f55">Few real orders</text>
      <text x="1085" y="526" font-size="19" fill="#655f55">Verify every label</text>
    </g>
    <g fill="#ffffff">
      <rect x="1325" y="350" width="56" height="56" rx="17" fill="#ffcb16"/><text x="1353" y="389" text-anchor="middle" font-size="26" font-weight="900" fill="#24221f">6</text>
      <text x="1325" y="458" font-size="25" font-weight="850">Monitor</text>
      <text x="1325" y="497" font-size="19" fill="#eee7da">Runs · errors</text>
      <text x="1325" y="526" font-size="19" fill="#eee7da">Owner · retry</text>
    </g>

    <path d="M1402 560v86H800" fill="none" stroke="#7a7267" stroke-width="5" marker-end="url(#arrow2)"/>
    <rect x="420" y="647" width="760" height="108" rx="34" fill="#ffcb16"/>
    <text x="800" y="692" text-anchor="middle" font-size="26" font-weight="850">EXCEPTION QUEUE</text>
    <text x="800" y="728" text-anchor="middle" font-size="22" fill="#514b42">No label purchased · named owner · next action</text>
    <rect x="325" y="808" width="950" height="48" rx="24" fill="#24221f"/>
    <text x="800" y="840" text-anchor="middle" font-size="20" font-weight="750" fill="#ffffff">Correct order + correct label + expected cost + visible exceptions</text>
  </g>
</svg>
