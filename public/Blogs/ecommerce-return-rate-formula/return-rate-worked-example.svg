<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Worked ecommerce return rate example</title>
  <desc id="desc">An illustrative flow from a closed purchase cohort to order, unit, and revenue return rate calculations.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="90" y="112" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#131313">Close one cohort. Calculate three rates.</text>
  <text x="90" y="158" font-family="Inter, Arial, sans-serif" font-size="24" fill="#707178">Illustrative example — values are not a benchmark.</text>
  <rect x="90" y="220" width="430" height="500" rx="32" fill="#131313"/>
  <text x="130" y="278" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#facc15">PURCHASE COHORT</text>
  <text x="130" y="350" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#f6f5f1">1,000 orders</text>
  <text x="130" y="405" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#f6f5f1">1,450 units</text>
  <text x="130" y="460" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#f6f5f1">60,000 value</text>
  <line x1="130" y1="505" x2="480" y2="505" stroke="#707178" stroke-width="3"/>
  <text x="130" y="552" font-family="Inter, Arial, sans-serif" font-size="24" fill="#f6f5f1">After the return window:</text>
  <text x="130" y="600" font-family="Inter, Arial, sans-serif" font-size="25" fill="#facc15">120 returned orders</text>
  <text x="130" y="640" font-family="Inter, Arial, sans-serif" font-size="25" fill="#facc15">180 returned units</text>
  <text x="130" y="680" font-family="Inter, Arial, sans-serif" font-size="25" fill="#facc15">9,000 returned value</text>
  <path d="M548 470h92" stroke="#707178" stroke-width="8" stroke-linecap="round"/>
  <path d="M620 446l28 24-28 24" fill="none" stroke="#707178" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="690" y="220" width="820" height="138" rx="26" fill="#facc15"/>
    <text x="730" y="276" font-size="27" font-weight="700" fill="#131313">ORDER RETURN RATE</text>
    <text x="730" y="326" font-size="34" font-weight="800" fill="#131313">120 ÷ 1,000 × 100 = 12%</text>
    <rect x="690" y="401" width="820" height="138" rx="26" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="730" y="457" font-size="27" font-weight="700" fill="#131313">UNIT RETURN RATE</text>
    <text x="730" y="507" font-size="34" font-weight="800" fill="#131313">180 ÷ 1,450 × 100 = 12.4%</text>
    <rect x="690" y="582" width="820" height="138" rx="26" fill="#131313"/>
    <text x="730" y="638" font-size="27" font-weight="700" fill="#facc15">REVENUE RETURN RATE</text>
    <text x="730" y="688" font-size="34" font-weight="800" fill="#f6f5f1">9,000 ÷ 60,000 × 100 = 15%</text>
  </g>
  <text x="800" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#707178">Same cohort. Different business questions.</text>
</svg>
