<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Automatic discount two-cart decision flow</title>
  <desc id="desc">A diagram comparing a qualifying control cart with a boundary cart and routing the results to rule, context, or combination checks.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="100" y="90" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">The two-cart decision flow</text>
  <text x="100" y="138" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="27">Illustrative diagnostic: keep context fixed and change one rule.</text>

  <rect x="100" y="205" width="430" height="150" rx="28" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="315" y="258" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">CONTROL CART</text>
  <text x="315" y="298" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">All eligibility rules present</text>
  <text x="315" y="330" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">Predict exact discount</text>

  <rect x="1070" y="205" width="430" height="150" rx="28" fill="#131313"/>
  <text x="1285" y="258" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">BOUNDARY CART</text>
  <text x="1285" y="298" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="23">Remove one required condition</text>
  <text x="1285" y="330" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="23">Predict no discount</text>

  <path d="M530 280H704M896 280H1070" stroke="#707178" stroke-width="6" stroke-linecap="round"/>
  <path d="M680 255L710 280L680 305M920 255L890 280L920 305" fill="none" stroke="#707178" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="280" r="86" fill="#f6f5f1" stroke="#131313" stroke-width="5"/>
  <text x="800" y="272" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">SAME</text>
  <text x="800" y="305" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">context</text>

  <path d="M315 355V450M1285 355V450" stroke="#131313" stroke-width="6"/>
  <path d="M290 425L315 455L340 425M1260 425L1285 455L1310 425" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="455" width="430" height="126" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="315" y="505" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">DID THE CONTROL PASS?</text>
  <text x="315" y="544" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">No = rule or execution gap</text>

  <rect x="1070" y="455" width="430" height="126" rx="24" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
  <text x="1285" y="505" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">DID THE BOUNDARY FAIL?</text>
  <text x="1285" y="544" text-anchor="middle" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">No = missing rule enforcement</text>

  <path d="M530 518H680M920 518H1070" stroke="#131313" stroke-width="6" stroke-linecap="round"/>
  <path d="M650 493L680 518L650 543M950 493L920 518L950 543" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="680" y="440" width="240" height="156" rx="28" fill="#facc15" stroke="#131313" stroke-width="4"/>
  <text x="800" y="490" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">EXPECTED</text>
  <text x="800" y="526" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">control passes</text>
  <text x="800" y="558" text-anchor="middle" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="23">boundary fails</text>

  <path d="M800 596V660" stroke="#131313" stroke-width="6"/>
  <path d="M775 635L800 665L825 635" fill="none" stroke="#131313" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260" y="665" width="1080" height="126" rx="28" fill="#131313"/>
  <text x="800" y="715" text-anchor="middle" fill="#facc15" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">NEXT: ADD ONE CONTEXT OR COMPETING OFFER</text>
  <text x="800" y="756" text-anchor="middle" fill="#f6f5f1" font-family="Inter, Arial, sans-serif" font-size="23">Market • customer • purchase type • app • combination</text>

  <text x="100" y="854" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="22">Illustrative diagnostic model. Record the expected and observed result for each cart.</text>
</svg>
