<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify payment method visibility matrix</title>
  <desc id="desc">A checkout panel compares cards, wallets, and local payment methods across shopper markets to reveal where a method disappears.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <g font-family="Inter, Arial, sans-serif" fill="#131313">
    <text x="110" y="120" font-size="62" font-weight="800">Payment method missing?</text>
    <text x="110" y="172" font-size="28" fill="#707178">Compare the same cart across shopper contexts.</text>

    <rect x="110" y="235" width="700" height="525" rx="30" fill="#131313"/>
    <text x="160" y="300" font-size="30" font-weight="700" fill="#f6f5f1">Checkout payment step</text>
    <rect x="160" y="345" width="600" height="92" rx="18" fill="#f6f5f1"/>
    <circle cx="205" cy="391" r="17" fill="#facc15"/>
    <text x="245" y="401" font-size="27">Credit or debit card</text>
    <rect x="160" y="459" width="600" height="92" rx="18" fill="#f6f5f1"/>
    <circle cx="205" cy="505" r="17" fill="#facc15"/>
    <text x="245" y="515" font-size="27">Digital wallet</text>
    <rect x="160" y="573" width="600" height="92" rx="18" fill="#f6f5f1"/>
    <circle cx="205" cy="619" r="17" fill="#707178"/>
    <text x="245" y="629" font-size="27">Local payment method</text>
    <text x="160" y="715" font-size="24" fill="#facc15">Visible here, absent elsewhere</text>

    <path d="M850 490H970" stroke="#131313" stroke-width="12" stroke-linecap="round"/>
    <path d="M940 455L980 490L940 525" fill="none" stroke="#131313" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1000" y="235" width="490" height="525" rx="30" fill="#facc15"/>
    <text x="1050" y="300" font-size="30" font-weight="800">Context matrix</text>
    <line x1="1050" y1="340" x2="1440" y2="340" stroke="#131313" stroke-width="4"/>
    <text x="1050" y="390" font-size="25" font-weight="700">Market</text>
    <text x="1270" y="390" font-size="24">Main / affected</text>
    <line x1="1050" y1="420" x2="1440" y2="420" stroke="#131313" stroke-width="2"/>
    <text x="1050" y="470" font-size="25" font-weight="700">Currency</text>
    <text x="1270" y="470" font-size="24">Store / local</text>
    <line x1="1050" y1="500" x2="1440" y2="500" stroke="#131313" stroke-width="2"/>
    <text x="1050" y="550" font-size="25" font-weight="700">Customer</text>
    <text x="1270" y="550" font-size="24">Guest / signed in</text>
    <line x1="1050" y1="580" x2="1440" y2="580" stroke="#131313" stroke-width="2"/>
    <text x="1050" y="630" font-size="25" font-weight="700">Device</text>
    <text x="1270" y="630" font-size="24">Mobile / desktop</text>
    <rect x="1050" y="670" width="390" height="58" rx="16" fill="#131313"/>
    <text x="1245" y="708" text-anchor="middle" font-size="24" font-weight="700" fill="#f6f5f1">Change one field per test</text>
  </g>
</svg>

