<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify return rule precedence diagram</title><desc id="desc">A four-stage decision flow showing that final sale takes priority, then the shortest matching override, then the market rule, and finally the store default.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7eb"/><stop offset="1" stop-color="#efe8d6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#28251e" flood-opacity=".14"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif"><text x="100" y="105" fill="#aa442d" font-size="22" font-weight="800" letter-spacing="4">SHOPIFY RETURN RULE PRECEDENCE</text><text x="100" y="170" fill="#191815" font-size="48" font-weight="800">Which rule controls the item?</text><text x="100" y="212" fill="#635e53" font-size="23">Resolve the order first. Then test the customer-facing result.</text>
    <g filter="url(#shadow)">
      <rect x="100" y="300" width="315" height="260" rx="28" fill="#1b1a17"/><circle cx="155" cy="355" r="25" fill="#ff7a59"/><text x="155" y="364" text-anchor="middle" fill="#1b1a17" font-size="24" font-weight="900">1</text><text x="145" y="425" fill="#fffaf0" font-size="30" font-weight="800">Final sale?</text><text x="145" y="470" fill="#c9c4b8" font-size="20">It wins over an override.</text><text x="145" y="510" fill="#ff9d82" font-size="18">Only where your legal</text><text x="145" y="538" fill="#ff9d82" font-size="18">obligations allow it.</text>
      <rect x="460" y="300" width="315" height="260" rx="28" fill="#fffaf0"/><circle cx="515" cy="355" r="25" fill="#f0c348"/><text x="515" y="364" text-anchor="middle" fill="#1b1a17" font-size="24" font-weight="900">2</text><text x="505" y="425" fill="#191815" font-size="30" font-weight="800">Override?</text><text x="505" y="470" fill="#635e53" font-size="20">Product, variant, or</text><text x="505" y="500" fill="#635e53" font-size="20">collection can match.</text><text x="505" y="538" fill="#aa442d" font-size="18" font-weight="700">Shortest match wins.</text>
      <rect x="820" y="300" width="315" height="260" rx="28" fill="#fffaf0"/><circle cx="875" cy="355" r="25" fill="#f0c348"/><text x="875" y="364" text-anchor="middle" fill="#1b1a17" font-size="24" font-weight="900">3</text><text x="865" y="425" fill="#191815" font-size="30" font-weight="800">Market rule?</text><text x="865" y="470" fill="#635e53" font-size="20">Use it instead of the</text><text x="865" y="500" fill="#635e53" font-size="20">storewide default.</text><text x="865" y="538" fill="#aa442d" font-size="18" font-weight="700">Early access applies.</text>
      <rect x="1180" y="300" width="315" height="260" rx="28" fill="#fffaf0"/><circle cx="1235" cy="355" r="25" fill="#f0c348"/><text x="1235" y="364" text-anchor="middle" fill="#1b1a17" font-size="24" font-weight="900">4</text><text x="1225" y="425" fill="#191815" font-size="30" font-weight="800">Default</text><text x="1225" y="470" fill="#635e53" font-size="20">The fallback when no</text><text x="1225" y="500" fill="#635e53" font-size="20">higher rule applies.</text><text x="1225" y="538" fill="#aa442d" font-size="18" font-weight="700">Keep it understandable.</text>
    </g>
    <g fill="none" stroke="#aa442d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M420 430h32"/><path d="M442 420l12 10-12 10"/><path d="M780 430h32"/><path d="M802 420l12 10-12 10"/><path d="M1140 430h32"/><path d="M1162 420l12 10-12 10"/></g>
    <rect x="100" y="650" width="1395" height="120" rx="26" fill="#ded5c0"/><text x="145" y="702" fill="#191815" font-size="22" font-weight="800">CONTROL TEST</text><text x="145" y="743" fill="#4e493f" font-size="22">For every market and item: admin rule = written policy = product-page message = support answer.</text>
  </g>
</svg>
