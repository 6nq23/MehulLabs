<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify compare-at prices become readable by AI shopping agents</title>
  <desc id="desc">A product price card with a current price of 72 dollars and an illustrative compare-at price of 90 dollars flows through Shopify Catalog into an AI shopping agent card. Labels explain that price stays current and compare-at becomes list_price.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a2518" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9dd"/>
      <stop offset="1" stop-color="#f5ead0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#fffaf0"/>
  <circle cx="90" cy="80" r="250" fill="#fff0a8" opacity="0.78"/>
  <circle cx="1530" cy="850" r="310" fill="#ead7a6" opacity="0.55"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="92" y="112" font-size="20" font-weight="750" letter-spacing="3" fill="#765900">SHOPIFY PRICE DATA · OCTOBER 2026</text>
    <text x="92" y="205" font-size="72" font-weight="760" letter-spacing="-2.5" fill="#1a1a18">One more price field</text>
    <text x="92" y="286" font-size="72" font-weight="760" letter-spacing="-2.5" fill="#765900">enters the AI aisle.</text>
    <text x="92" y="342" font-size="25" fill="#5b513b">Current price stays in price. Eligible compare-at moves in list_price.</text>

    <g filter="url(#shadow)">
      <rect x="92" y="412" width="450" height="330" rx="30" fill="#ffffff" stroke="#e3d39f" stroke-width="2"/>
    </g>
    <rect x="126" y="448" width="130" height="34" rx="17" fill="#fff0a8"/>
    <text x="191" y="472" text-anchor="middle" font-size="16" font-weight="750" fill="#6b5000">PRODUCT DATA</text>
    <text x="126" y="535" font-size="31" font-weight="740" fill="#1a1a18">Weekend carry bag</text>
    <text x="126" y="585" font-size="21" fill="#675f4f">Illustrative offer</text>
    <text x="126" y="664" font-size="58" font-weight="780" fill="#1a1a18">$72</text>
    <text x="286" y="658" font-size="30" fill="#827865" text-decoration="line-through">$90</text>
    <text x="126" y="706" font-size="17" fill="#675f4f">price</text>
    <text x="286" y="706" font-size="17" fill="#675f4f">compare-at</text>

    <path d="M575 575 H724" fill="none" stroke="#d4aa24" stroke-width="8" stroke-linecap="round"/>
    <path d="M704 553 L736 575 L704 597" fill="none" stroke="#d4aa24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="580" y="621" width="148" height="42" rx="21" fill="#fff4bf"/>
    <text x="654" y="649" text-anchor="middle" font-size="18" font-weight="740" fill="#6b5000">CATALOG</text>

    <g filter="url(#shadow)">
      <rect x="770" y="412" width="738" height="330" rx="30" fill="url(#soft)" stroke="#dfc978" stroke-width="2"/>
    </g>
    <rect x="808" y="448" width="168" height="34" rx="17" fill="#f2ce5b"/>
    <text x="892" y="472" text-anchor="middle" font-size="16" font-weight="780" fill="#352900">AI SHOPPING VIEW</text>
    <text x="808" y="535" font-size="31" font-weight="740" fill="#1a1a18">Structured price context</text>
    <rect x="808" y="574" width="310" height="112" rx="18" fill="#ffffff" stroke="#e2d5ac" stroke-width="2"/>
    <text x="836" y="615" font-size="18" font-weight="700" fill="#675f4f">CURRENT PRICE</text>
    <text x="1088" y="654" text-anchor="end" font-size="42" font-weight="780" fill="#1a1a18">$72</text>
    <rect x="1152" y="574" width="318" height="112" rx="18" fill="#ffffff" stroke="#e2d5ac" stroke-width="2"/>
    <text x="1180" y="615" font-size="18" font-weight="700" fill="#675f4f">LIST_PRICE</text>
    <text x="1440" y="654" text-anchor="end" font-size="42" font-weight="780" fill="#765900">$90</text>
    <text x="808" y="716" font-size="18" fill="#675f4f">Merchant-controlled · Region-aware · Display not guaranteed</text>

    <rect x="92" y="792" width="1416" height="62" rx="20" fill="#1a1a18"/>
    <text x="800" y="832" text-anchor="middle" font-size="23" font-weight="700" fill="#fff8df">Audit the source, variants, margin, markets, surfaces, and sharing setting.</text>
  </g>
</svg>
