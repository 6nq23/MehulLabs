<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative quantity-break contribution ladder</title>
  <desc id="desc">A comparison of one, three and five unit tiers showing price per unit and contribution per unit.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="115" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">The deepest discount is not always the strongest tier</text>
  <text x="110" y="165" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="25">ILLUSTRATIVE EXAMPLE • NEUTRAL BASE CURRENCY</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="110" y="285" fill="#707178" font-size="25" font-weight="700">QUANTITY</text>
    <text x="600" y="285" fill="#707178" font-size="25" font-weight="700">UNIT PRICE</text>
    <text x="1010" y="285" fill="#707178" font-size="25" font-weight="700">CONTRIBUTION / UNIT</text>
    <line x1="110" y1="315" x2="1490" y2="315" stroke="#707178" stroke-width="3"/>
    <rect x="110" y="350" width="1380" height="120" rx="18" fill="#131313"/>
    <text x="160" y="425" fill="#f6f5f1" font-size="36" font-weight="700">1 unit</text>
    <text x="650" y="425" fill="#facc15" font-size="40" font-weight="800">40</text>
    <text x="1100" y="425" fill="#f6f5f1" font-size="40" font-weight="800">13.00</text>
    <rect x="110" y="495" width="1380" height="120" rx="18" fill="#707178"/>
    <text x="160" y="570" fill="#f6f5f1" font-size="36" font-weight="700">3 units</text>
    <text x="650" y="570" fill="#facc15" font-size="40" font-weight="800">36</text>
    <text x="1100" y="570" fill="#f6f5f1" font-size="40" font-weight="800">16.33</text>
    <rect x="110" y="640" width="1380" height="120" rx="18" fill="#131313"/>
    <text x="160" y="715" fill="#f6f5f1" font-size="36" font-weight="700">5 units</text>
    <text x="650" y="715" fill="#facc15" font-size="40" font-weight="800">32</text>
    <text x="1100" y="715" fill="#f6f5f1" font-size="40" font-weight="800">13.80</text>
    <text x="110" y="835" fill="#707178" font-size="24">Shared order costs lift the middle tier; a deeper discount reduces part of that gain.</text>
  </g>
</svg>
