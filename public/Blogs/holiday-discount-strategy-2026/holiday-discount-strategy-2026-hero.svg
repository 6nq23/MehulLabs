<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Discount depth versus contribution per order</title>
  <desc id="d">Four stacked bars show a fixed cost, a shrinking contribution and a growing discount as the discount rises from 0 to 30 percent.</desc>
  <rect width="1600" height="900" fill="#f7f7f2"/>
  <circle cx="120" cy="-10" r="260" fill="#efede7"/>
  <circle cx="1560" cy="930" r="300" fill="#ebe8dd"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <line x1="72" y1="172" x2="104" y2="172" stroke="#ffcb16" stroke-width="3"/>
    <text x="116" y="179" font-size="20" font-weight="700" letter-spacing="3" fill="#6b675c">DISCOUNT STRATEGY 2026</text>
    <text x="72" y="290" font-size="70" font-weight="800" fill="#18181b" letter-spacing="-2">How deep can you</text>
    <text x="72" y="368" font-size="70" font-weight="800" fill="#18181b" letter-spacing="-2">discount and</text>
    <text x="72" y="446" font-size="70" font-weight="800" fill="#18181b" letter-spacing="-2">still profit?</text>
    <text x="72" y="520" font-size="28" fill="#605d56">Every point of discount comes straight out</text>
    <text x="72" y="558" font-size="28" fill="#605d56">of contribution per order.</text>
    <rect x="72" y="610" width="600" height="110" rx="18" fill="#efede7" stroke="#dddad1"/>
    <text x="96" y="656" font-size="26" font-weight="700" fill="#18181b">At 30% off, this order keeps only 44%</text>
    <text x="96" y="694" font-size="26" font-weight="700" fill="#18181b">of its original contribution.</text>
    <text x="72" y="812" font-size="20" fill="#605d56">Illustrative example: ₹1,500 list price, ₹700 variable cost per order. Not a benchmark.</text>

    <rect x="820" y="130" width="710" height="640" rx="28" fill="#efede7" stroke="#dddad1"/>
    <text x="852" y="184" font-size="26" font-weight="700" fill="#18181b">Contribution per order before ads (₹)</text>
    <g font-size="18" fill="#605d56">
      <rect x="852" y="212" width="18" height="18" rx="4" fill="#dddad1"/><text x="880" y="227">Variable cost</text>
      <rect x="1012" y="212" width="18" height="18" rx="4" fill="#18181b"/><text x="1040" y="227">Contribution</text>
      <rect x="1182" y="212" width="18" height="18" rx="4" fill="#ffcb16"/><text x="1210" y="227">Given away</text>
    </g>
    <line x1="850" y1="690" x2="1510" y2="690" stroke="#dddad1" stroke-width="2"/>
    <!-- 0% -->
    <rect x="870" y="503.3" width="120" height="186.7" rx="6" fill="#dddad1"/>
    <rect x="870" y="290" width="120" height="213.3" rx="6" fill="#18181b"/>
    <!-- 10% -->
    <rect x="1040" y="503.3" width="120" height="186.7" rx="6" fill="#dddad1"/>
    <rect x="1040" y="330" width="120" height="173.3" rx="6" fill="#18181b"/>
    <rect x="1040" y="290" width="120" height="40" rx="6" fill="#ffcb16"/>
    <!-- 20% -->
    <rect x="1210" y="503.3" width="120" height="186.7" rx="6" fill="#dddad1"/>
    <rect x="1210" y="370" width="120" height="133.3" rx="6" fill="#18181b"/>
    <rect x="1210" y="290" width="120" height="80" rx="6" fill="#ffcb16"/>
    <!-- 30% -->
    <rect x="1380" y="503.3" width="120" height="186.7" rx="6" fill="#dddad1"/>
    <rect x="1380" y="410" width="120" height="93.3" rx="6" fill="#18181b"/>
    <rect x="1380" y="290" width="120" height="120" rx="6" fill="#ffcb16"/>
    <g font-size="24" font-weight="700" text-anchor="middle">
      <text x="930" y="406" fill="#f7f7f2">800</text>
      <text x="1100" y="426" fill="#f7f7f2">650</text>
      <text x="1270" y="446" fill="#f7f7f2">500</text>
      <text x="1440" y="463" fill="#f7f7f2">350</text>
      <text x="1100" y="317" fill="#18181b" font-size="20">150</text>
      <text x="1270" y="336" fill="#18181b" font-size="20">300</text>
      <text x="1440" y="356" fill="#18181b" font-size="20">450</text>
      <text x="930" y="605" fill="#605d56" font-size="20">700</text>
      <text x="1100" y="605" fill="#605d56" font-size="20">700</text>
      <text x="1270" y="605" fill="#605d56" font-size="20">700</text>
      <text x="1440" y="605" fill="#605d56" font-size="20">700</text>
    </g>
    <g font-size="22" font-weight="700" fill="#18181b" text-anchor="middle">
      <text x="930" y="724">Full price</text>
      <text x="1100" y="724">10% off</text>
      <text x="1270" y="724">20% off</text>
      <text x="1440" y="724">30% off</text>
    </g>
  </g>
</svg>
