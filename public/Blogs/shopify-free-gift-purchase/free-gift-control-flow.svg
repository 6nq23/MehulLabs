<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Free gift control flow</title>
  <desc id="desc">A flow moves from shopper promise through qualification, gift selection, checkout, inventory, and fulfilment, with failure controls beneath each stage.</desc>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="110" y="112" fill="#131313" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Keep the gift promise intact</text>
  <text x="110" y="162" fill="#707178" font-family="Inter, Arial, sans-serif" font-size="28">Stop the launch when any control disagrees with the storefront.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="270" width="240" height="162" rx="22" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="230" y="334" text-anchor="middle" fill="#131313" font-size="28" font-weight="700">Promise</text>
    <text x="230" y="380" text-anchor="middle" fill="#707178" font-size="23">Gift and fallback</text>

    <path d="M350 351H405" stroke="#131313" stroke-width="7"/>
    <path d="M385 332L407 351L385 370" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="415" y="270" width="240" height="162" rx="22" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="535" y="334" text-anchor="middle" fill="#131313" font-size="28" font-weight="700">Qualify</text>
    <text x="535" y="380" text-anchor="middle" fill="#707178" font-size="23">Cart and market</text>

    <path d="M655 351H710" stroke="#131313" stroke-width="7"/>
    <path d="M690 332L712 351L690 370" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="720" y="270" width="240" height="162" rx="22" fill="#facc15" stroke="#131313" stroke-width="4"/>
    <text x="840" y="334" text-anchor="middle" fill="#131313" font-size="28" font-weight="700">Select</text>
    <text x="840" y="380" text-anchor="middle" fill="#131313" font-size="23">Product and variant</text>

    <path d="M960 351H1015" stroke="#131313" stroke-width="7"/>
    <path d="M995 332L1017 351L995 370" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1025" y="270" width="240" height="162" rx="22" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1145" y="334" text-anchor="middle" fill="#131313" font-size="28" font-weight="700">Checkout</text>
    <text x="1145" y="380" text-anchor="middle" fill="#707178" font-size="23">Price and stacking</text>

    <path d="M1265 351H1300" stroke="#131313" stroke-width="7"/>
    <path d="M1280 332L1302 351L1280 370" fill="none" stroke="#131313" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1310" y="270" width="190" height="162" rx="22" fill="#f6f5f1" stroke="#131313" stroke-width="4"/>
    <text x="1405" y="334" text-anchor="middle" fill="#131313" font-size="28" font-weight="700">Pack</text>
    <text x="1405" y="380" text-anchor="middle" fill="#707178" font-size="23">Stock + SKU</text>

    <path d="M230 432V536M535 432V536M840 432V536M1145 432V536M1405 432V536" stroke="#707178" stroke-width="5" stroke-dasharray="12 10"/>

    <rect x="110" y="536" width="240" height="166" rx="20" fill="#131313"/>
    <text x="230" y="604" text-anchor="middle" fill="#facc15" font-size="25" font-weight="700">Clear copy</text>
    <text x="230" y="650" text-anchor="middle" fill="#f6f5f1" font-size="22">No hidden condition</text>

    <rect x="415" y="536" width="240" height="166" rx="20" fill="#131313"/>
    <text x="535" y="604" text-anchor="middle" fill="#facc15" font-size="25" font-weight="700">Same basis</text>
    <text x="535" y="650" text-anchor="middle" fill="#f6f5f1" font-size="22">Cart equals checkout</text>

    <rect x="720" y="536" width="240" height="166" rx="20" fill="#131313"/>
    <text x="840" y="604" text-anchor="middle" fill="#facc15" font-size="25" font-weight="700">Valid choice</text>
    <text x="840" y="650" text-anchor="middle" fill="#f6f5f1" font-size="22">Available variant only</text>

    <rect x="1025" y="536" width="240" height="166" rx="20" fill="#131313"/>
    <text x="1145" y="604" text-anchor="middle" fill="#facc15" font-size="25" font-weight="700">Expected total</text>
    <text x="1145" y="650" text-anchor="middle" fill="#f6f5f1" font-size="22">No stack surprise</text>

    <rect x="1310" y="536" width="190" height="166" rx="20" fill="#131313"/>
    <text x="1405" y="604" text-anchor="middle" fill="#facc15" font-size="25" font-weight="700">Scannable</text>
    <text x="1405" y="650" text-anchor="middle" fill="#f6f5f1" font-size="22">Order has SKU</text>

    <rect x="110" y="774" width="1390" height="68" rx="17" fill="#facc15"/>
    <text x="805" y="818" text-anchor="middle" fill="#131313" font-size="25" font-weight="700">If the cart changes, re-check every downstream control.</text>
  </g>
</svg>
